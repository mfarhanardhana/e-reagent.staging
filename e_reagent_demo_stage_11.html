                <button type="button" data-link="${esc(it.tpl ? it.ex : it.url)}" onclick="copyLinkFrom(this)" class="shrink-0 px-2.5 py-1 rounded-lg bg-white border border-slate-300 hover:bg-slate-100 text-[11px] font-semibold inline-flex items-center gap-1"><i data-lucide="copy" class="w-3 h-3"></i> Salin</button>
              </div>
              <div class="font-mono text-[11px] bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-800 break-all">${esc(it.url)}</div>
            </div>
          `).join('')}
        </div>
        <div class="px-5 py-3 border-t border-slate-100 flex justify-end">
          <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-navy-900 text-white">Tutup</button>
        </div>
      `, 'max-w-xl');
    }

    function openReagentDetail(kind, id) {
      const lot = kind === 'stock' ? appState.lots.find(l => l.id === id) : null;
      const item = kind === 'inuse' ? appState.inUse.find(i => i.id === id) : null;
      const rec = lot || item;
      const master = rec ? getMasterById(rec.masterId) : null;
      if (!rec || !master) return;

      const isStock = kind === 'stock';
      const stockStat = getMasterStockStatus(master.id);
      const edMfgStatus = getEDStatus(rec.ed);
      const edLabStr = !isStock ? (item.openedEd || item.ed) : null;
      const edLabStatus = !isStock ? getEDStatus(edLabStr) : null;
      const loc = isStock ? master.cabinet : (item.inUseCabinet || getDefaultInUseCabinet(master.physicalForm));
      const deepUrl = buildDeepLink(isStock ? 'stock-list' : 'in-use', master.catalogNo, rec.batchNo);
      const logs = appState.auditLogs.filter(l => l.reagentName === master.name && l.batchNo === rec.batchNo).slice(0, 6);

      const cell = (lbl, val) => `
        <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/80">
          <div class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">${lbl}</div>
          <div class="text-xs font-semibold text-slate-800 mt-0.5">${val}</div>
        </div>`;

      openModal(`
        <div class="p-5 border-b border-slate-100 flex items-start justify-between gap-3 bg-navy-900 text-white">
          <div>
            <div class="text-[10px] uppercase tracking-wider font-semibold text-teal-300">${isStock ? 'Kartu Identitas — Stock' : 'Kartu Identitas — Reagent In-Use'}</div>
            <h3 class="text-base font-bold mt-0.5 leading-snug">${esc(master.name)}</h3>
            <div class="text-xs font-mono text-slate-300 mt-0.5">Cat no. ${esc(master.catalogNo)} &bull; Lot ${esc(rec.batchNo)}</div>
          </div>
          <button onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <div class="p-5 space-y-4 max-h-[75vh] overflow-y-auto text-xs">
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
            ${cell('Nama Reagen', esc(master.name))}
            ${cell('Cat no.', `<span class="font-mono">${esc(master.catalogNo)}</span>`)}
            ${cell('Batch / Lot', `<span class="font-mono">${esc(rec.batchNo)}</span>`)}
            ${cell('Manufaktur', esc(master.manufacturer || '-'))}
            ${cell('Kemasan', esc(master.volumePerBottle))}
            ${cell('Bentuk & Kategori', `${esc(master.physicalForm)} &bull; ${renderCategoryBadge(master.category)}`)}
            ${cell(isStock ? 'Lemari Stock' : 'Lemari In-Use', renderCabinetBadge(loc))}
            ${cell('Tanggal Diterima', formatDateID(rec.receivedDate))}
            ${cell('ED Manufacturer', `${formatDateID(rec.ed)} <div class="mt-1"><span class="inline-flex px-1.5 py-0.5 rounded text-[10px] font-semibold border ${edMfgStatus.badgeClass}">${edMfgStatus.label}</span></div>`)}
            ${isStock ? `
              ${cell('Quantity Lot Ini', `${lot.qty} botol`)}
              ${cell('Total Stok Valid', `${stockStat.validQty} / min ${stockStat.minStock} botol`)}
              ${cell('Date Modified', esc(lot.dateModified || '-'))}
            ` : `
              ${cell('Tanggal Dibuka', formatDateID(item.openedDate))}
              ${cell('ED Lab', `${formatDateID(edLabStr)} <div class="mt-1"><span class="inline-flex px-1.5 py-0.5 rounded text-[10px] font-semibold border ${edLabStatus.badgeClass}">${edLabStatus.label}</span></div>`)}
              ${cell('Dibuka Oleh', esc(item.openedBy || '-'))}
            `}
          </div>

          <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Link Barcode / QR Langsung</div>
              <div class="font-mono text-[11px] text-slate-700 truncate mt-0.5">${esc(deepUrl)}</div>
            </div>
            <button type="button" data-link="${esc(deepUrl)}" onclick="copyLinkFrom(this)" class="shrink-0 px-2.5 py-1.5 rounded-lg bg-white border border-slate-300 hover:bg-slate-100 text-[11px] font-semibold inline-flex items-center gap-1"><i data-lucide="copy" class="w-3 h-3"></i> Salin Link</button>
          </div>

          ${logs.length > 0 ? `
            <div>
              <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Riwayat Lot Ini</div>
              <div class="border border-slate-200 rounded-xl divide-y divide-slate-100">
                ${logs.map(l => `
                  <div class="px-3 py-2 flex items-start justify-between gap-3">
                    <div>
                      <div class="font-semibold text-slate-800">${esc(l.changeSummary)}</div>
                      <div class="text-[11px] text-slate-500">${esc(l.notes)}</div>
                    </div>
                    <div class="text-right font-mono text-[10px] text-slate-400 shrink-0">${esc(l.timestamp)}<br>${esc(l.user)}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>

        <div class="px-5 py-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Tutup</button>
          <div class="flex flex-wrap items-center gap-2">
            ${isStock ? `
              <button type="button" onclick="closeModal(); openReorderModal('${master.id}', 2)" class="px-3 py-2 rounded-xl bg-teal-50 hover:bg-teal-600 text-teal-800 hover:text-white border border-teal-200 text-xs font-semibold inline-flex items-center gap-1.5"><i data-lucide="shopping-cart" class="w-3.5 h-3.5"></i> Re-order</button>
              <button type="button" onclick="closeModal(); openAdjustmentModal('${lot.id}')" class="px-3 py-2 rounded-xl bg-navy-900 hover:bg-teal-700 text-white text-xs font-semibold inline-flex items-center gap-1.5"><i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i> Adjust</button>
            ` : item.status === 'ACTIVE' ? `
              <button type="button" onclick="closeModal(); openEditOpenedEdModal('${item.id}')" class="px-3 py-2 rounded-xl bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold inline-flex items-center gap-1.5"><i data-lucide="calendar-clock" class="w-3.5 h-3.5"></i> Ubah ED Lab</button>
              <button type="button" onclick="closeModal(); openCompleteInUseModal('${item.id}', 'COMPLETED')" class="px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold inline-flex items-center gap-1.5"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Tandai Habis</button>
            ` : ''}
          </div>
        </div>
      `, 'max-w-2xl');
    }

    // Export Buttons + PDF Print
    function renderExportButtons(scope) {
      return `
        <div class="inline-flex items-center gap-1.5">
          <button type="button" onclick="printDataset('${scope}')" class="px-3 py-2 rounded-xl bg-navy-900 hover:bg-slate-800 text-white text-xs font-semibold transition-colors inline-flex items-center gap-1.5 shadow-2xs" title="Cetak / Simpan sebagai PDF">
            <i data-lucide="printer" class="w-3.5 h-3.5"></i><span>Cetak / PDF</span>
          </button>
        </div>`;
    }

    function getExportDataset(scope) {
      if (scope === 'dashboard') {
        const m = getDashboardMetrics();
        const validSorted = [...m.validLots].sort((a, b) => a.ed.localeCompare(b.ed));
        return {
          title: 'LAPORAN RINGKASAN INVENTARIS & PRIORITAS FEFO',
          sub: `Item Aktif: ${m.activeMasterCount} | Stok Valid: ${m.totalSealedBottles} btl | Low Stock: ${m.lowStockMasters.length} | Near ED: ${m.nearEdLots.length} | Expired: ${m.expiredLots.length}`,
          filename: `Dashboard_E-Reagent_${getRelativeDateStr(0)}`,
          headers: ['No.', 'Nama Reagen', 'Cat no.', 'Manufaktur', 'Batch / Lot', 'ED Manufacturer', 'Status ED', 'Kemasan', 'Qty (btl)', 'Lokasi', 'Kategori'],
          rows: validSorted.map((lot, i) => {
            const mas = getMasterById(lot.masterId) || {};
            return [i + 1, mas.name || '-', mas.catalogNo || '-', mas.manufacturer || '-', lot.batchNo, formatDateID(lot.ed), getEDStatus(lot.ed).label, mas.volumePerBottle || '-', lot.qty, mas.cabinet || '-', catText(mas)];
          })
        };
      }
      if (scope === 'stock-db' || scope === 'stock-in-monitor') {
        const lots = scope === 'stock-db' ? getFilteredStockLots() : filterAndSortLots(stockInFilters);
        return {
          title: 'DAFTAR REAGENT STOCK (E-REAGENT)',
          sub: `Total ${lots.length} batch/lot`,
          filename: `Reagent_Stock_List_${getRelativeDateStr(0)}`,
          headers: ['No.', 'Nama Reagen', 'Cat no.', 'Manufaktur', 'Batch / Lot', 'ED Manufacturer', 'Status ED', 'Kemasan', 'Qty (btl)', 'Lokasi Simpan', 'Bentuk', 'Kategori / B3', 'Status Stok', 'Date Modified'],
          rows: lots.map((lot, i) => {
            const m = getMasterById(lot.masterId) || {};
            const st = getMasterStockStatus(lot.masterId);
            return [i + 1, m.name || '-', m.catalogNo || '-', m.manufacturer || '-', lot.batchNo, formatDateID(lot.ed), getEDStatus(lot.ed).label, m.volumePerBottle || '-', lot.qty, m.cabinet || '-', m.physicalForm || '-', catText(m), st.isLow ? `Low Stock (${st.validQty}/${st.minStock})` : `Stok Aman (${st.validQty}/${st.minStock})`, lot.dateModified || '-'];
          })
        };
      }
      if (scope === 'stock-out') {
        const lots = appState.lots.filter(l => !l.quarantined && Number(l.qty) > 0 && (!stockOutFilters.search || (() => { const m = getMasterById(l.masterId); return m && matchesQuery(stockOutFilters.search, m.name, m.catalogNo, l.batchNo, m.cabinet); })())).sort((a, b) => a.ed.localeCompare(b.ed));
        return {
          title: 'DAFTAR PRIORITAS POTONG STOCK (FEFO)',
          sub: `Total ${lots.length} batch/lot`,
          filename: `Potong_Stock_FEFO_${getRelativeDateStr(0)}`,
          headers: ['No.', 'Nama Reagen', 'Cat no.', 'Batch / Lot', 'ED Manufacturer', 'Status ED', 'Kemasan', 'Stok (btl)', 'Lokasi', 'Kategori / B3'],
          rows: lots.map((lot, i) => {
            const m = getMasterById(lot.masterId) || {};
            return [i + 1, m.name || '-', m.catalogNo || '-', lot.batchNo, formatDateID(lot.ed), getEDStatus(lot.ed).label, m.volumePerBottle || '-', lot.qty, m.cabinet || '-', catText(m)];
          })
        };
      }
      if (scope === 'orders') {
        const list = getFilteredOrders();
        const statusLabel = { BELUM_DIPESAN: 'Belum Dipesan', SUDAH_DIPESAN: 'Sudah Dipesan', DITERIMA: 'Sudah Diterima' };
        return {
          title: 'LIST PEMESANAN REAGEN LABORATORIUM',
          sub: `Total ${list.length} item pemesanan`,
          filename: `List_Pemesanan_E-Reagent_${getRelativeDateStr(0)}`,
          headers: ['No.', 'Nama Reagen', 'Cat no.', 'Manufaktur', 'Satuan', 'Jumlah', 'Status', 'No. PBJ', 'Analis Pemohon', 'Tgl Request', 'Keterangan'],
          rows: list.map((o, i) => [i + 1, o.reagentName, o.catalogNo || '-', o.manufacturer || '-', o.unit, o.qty, statusLabel[o.status] || o.status, o.pbjNo || '-', o.requestedBy || '-', formatDateID(o.requestDate), o.notes || '-'])
        };
      }
      if (scope === 'loans') {
        const list = getFilteredLoans();
        return {
          title: 'MONITOR PEMINJAMAN REAGEN',
          sub: `Total ${list.length} transaksi peminjaman`,
          filename: `Monitor_Peminjaman_${getRelativeDateStr(0)}`,
          headers: ['No.', 'Nama Reagen', 'Cat no.', 'Batch / Lot', 'Qty Dipinjam', 'Qty Kembali', 'Peminjam', 'Departemen', 'Tujuan', 'Tgl Pinjam', 'Jatuh Tempo', 'Tgl Kembali', 'Status', 'Analis'],
          rows: list.map((l, i) => {
            const m = getMasterById(l.masterId) || {};
            return [i + 1, m.name || '-', m.catalogNo || '-', l.batchNo, l.qty, l.returnedQty || 0, l.borrower, l.department, l.purpose, formatDateID(l.loanDate), formatDateID(l.dueDate), l.returnDate ? formatDateID(l.returnDate) : '-', getLoanState(l).label, l.lentBy || '-'];
          })
        };
      }
      if (scope === 'in-use') {
        const items = getFilteredInUse();
        return {
          title: `REAGENT IN-USE (${inUseFilters.tab === 'ACTIVE' ? 'SEDANG DIGUNAKAN' : 'ARSIP'})`,
          sub: `Total ${items.length} botol`,
          filename: `Reagent_InUse_${getRelativeDateStr(0)}`,
          headers: ['No.', 'Nama Reagen', 'Cat no.', 'Batch / Lot', 'ED Manufacturer', 'Tgl Dibuka', 'ED Lab', 'Kemasan', 'Lemari In-Use', 'Kategori / B3', 'Dibuka Oleh', 'Status'],
          rows: items.map((it, i) => {
            const m = getMasterById(it.masterId) || {};
            return [i + 1, m.name || '-', m.catalogNo || '-', it.batchNo, formatDateID(it.ed), formatDateID(it.openedDate), formatDateID(it.openedEd || it.ed), m.volumePerBottle || '-', it.inUseCabinet || getDefaultInUseCabinet(m.physicalForm), catText(m), it.openedBy || '-', it.status === 'ACTIVE' ? 'Aktif' : it.status === 'COMPLETED' ? 'Habis' : 'Dispose'];
          })
        };
      }
      if (scope === 'stock-in-history' || scope === 'stock-out-history') {
        const types = scope === 'stock-in-history' ? ['STOK_MASUK', 'REGISTRASI_BARU'] : ['POTONG_STOCK'];
        const logs = appState.auditLogs.filter(l => types.includes(l.actionType));
        return {
          title: scope === 'stock-in-history' ? 'RIWAYAT STOCK MASUK' : 'RIWAYAT POTONG STOCK',
          sub: `Total ${logs.length} catatan`,
          filename: `${scope}_${getRelativeDateStr(0)}`,
          headers: ['Tanggal & Jam', 'Analis', 'Aktivitas', 'Nama Reagen', 'Batch / Lot', 'Perubahan', 'Keterangan'],
          rows: logs.map(l => [l.timestamp, l.user, (ACTION_BADGES[l.actionType] || {}).label || l.actionType, l.reagentName, l.batchNo, l.changeSummary, l.notes])
        };
      }
      const logs = getFilteredAuditLogs();
      return {
        title: 'AUDIT TRAIL & LOG INVENTARIS REAGEN',
        sub: `Total ${logs.length} catatan`,
        filename: `Audit_Trail_E-Reagent_${getRelativeDateStr(0)}`,
        headers: ['Tanggal & Jam', 'Analis', 'Aktivitas', 'Nama Reagen', 'Batch / Lot', 'Perubahan', 'Keterangan'],
        rows: logs.map(l => [l.timestamp, l.user, (ACTION_BADGES[l.actionType] || {}).label || l.actionType, l.reagentName, l.batchNo, l.changeSummary, l.notes])
      };
    }

    function printDataset(scope) {
      const ds = getExportDataset(scope);
      const area = document.getElementById('print-area');
      const th = 'padding:6px;text-align:left;border:1px solid #cbd5e1;background:#f1f5f9;';
      const td = 'padding:5px 6px;border:1px solid #cbd5e1;vertical-align:top;';
      area.innerHTML = `
        <div style="font-family: Inter, sans-serif; color: #0f172a;">
          <div style="border-bottom: 2px solid #0f172a; padding-bottom: 10px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;">
            <div>
              <h1 style="font-size: 16px; font-weight: 700; margin: 0;">${esc(ds.title)}</h1>
              <p style="font-size: 11px; color: #475569; margin: 3px 0 0 0;">${esc(ds.sub)}</p>
            </div>
            <div style="text-align: right; font-size: 11px; color: #334155;">
              <div>Dicetak: <strong>${getCurrentTimestampStr(0)}</strong></div>
              <div>Analis: <strong>${esc(appState.lastAnalyst || '-')}</strong></div>
            </div>
          </div>
          <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
            <thead><tr>${ds.headers.map(h => `<th style="${th}">${esc(h)}</th>`).join('')}</tr></thead>
            <tbody>
              ${ds.rows.length === 0 ? `<tr><td colspan="${ds.headers.length}" style="${td}text-align:center;padding:12px;">Tidak ada data.</td></tr>`
                : ds.rows.map(r => `<tr>${r.map(v => `<td style="${td}">${esc(v)}</td>`).join('')}</tr>`).join('')}
            </tbody>
          </table>
        </div>`;
      area.classList.remove('hidden');
      window.print();
      setTimeout(() => area.classList.add('hidden'), 500);
    }

    function renderHistoryPanel(scope, types, title, subtitle) {
      const logs = appState.auditLogs.filter(l => types.includes(l.actionType));
      const isStockInHist = scope === 'stock-in-history';
      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-2xs space-y-3">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <h3 class="text-sm font-bold text-slate-900">${title}</h3>
              <p class="text-xs text-slate-500">${subtitle} (${logs.length} catatan)</p>
            </div>
            <div class="flex items-center gap-2">
              ${renderExportButtons(scope)}
              <button type="button" onclick="navigateTo('audit')" class="px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-teal-700 hover:bg-teal-50">Semua Log &rarr;</button>
            </div>
          </div>
          <div class="overflow-x-auto border border-slate-200 rounded-xl">
            <table class="w-full ${isStockInHist ? 'min-w-[1160px]' : 'min-w-[820px]'} text-left border-collapse">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                  <th class="py-2.5 px-3 w-12 text-center">No.</th>
                  <th class="py-2.5 px-3">Waktu Input</th>
                  <th class="py-2.5 px-3">Analis</th>
                  <th class="py-2.5 px-3">Reagen & Lot</th>
                  ${isStockInHist ? `
                    <th class="py-2.5 px-3">Cat no., Manufaktur & Kemasan</th>
                    <th class="py-2.5 px-3">Lokasi, Bentuk & Kategori</th>
                  ` : ''}
                  <th class="py-2.5 px-3">Qty / Perubahan</th>
                  <th class="py-2.5 px-3">Detail & Keterangan</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 text-xs">
                ${logs.length === 0 ? `<tr><td colspan="${isStockInHist ? 8 : 6}" class="py-8 text-center text-slate-500">Belum ada riwayat.</td></tr>`
                  : logs.map((log, idx) => {
                    const matchedMaster = appState.masters.find(m => m.name === log.reagentName);
                    const parts = String(log.notes || '').split(' | ').map(s => s.trim()).filter(Boolean);
                    const kv = {};
                    const extraNotes = [];
                    parts.forEach(p => {
                      const sepIdx = p.indexOf(':');
                      if (sepIdx > 0) {
                        const k = p.slice(0, sepIdx).trim();
                        const v = p.slice(sepIdx + 1).trim();
                        kv[k] = v;
                      } else {
                        extraNotes.push(p);
                      }
                    });
                    const catNo = kv['Cat no.'] || matchedMaster?.catalogNo || '-';
                    const mfg = kv['Manufaktur'] || matchedMaster?.manufacturer || '-';
                    const vol = kv['Kemasan'] || matchedMaster?.volumePerBottle || '-';
                    const cab = kv['Lemari'] || matchedMaster?.cabinet || '-';
                    const form = kv['Bentuk'] || matchedMaster?.physicalForm || '-';
                    const cat = kv['Kategori'] || (matchedMaster ? catText(matchedMaster) : '-');
                    const minSt = kv['Min. Stok'] || (matchedMaster ? `${matchedMaster.minStock} btl` : '-');
                    const edMfg = kv['ED Mfg'] || '-';
                    const tglTrx = kv['Tgl Terima'] || (log.timestamp || '').split(' ')[0] || '-';
                    const ket = kv['Ket'] || extraNotes.join(' ') || '-';

                    return `
                      <tr class="align-top hover:bg-slate-50">
                        <td class="py-2.5 px-3 text-center font-mono text-slate-500">${idx + 1}</td>
                        <td class="py-2.5 px-3 font-mono text-[11px] text-slate-700 whitespace-nowrap">
                          <div>${esc(log.timestamp)}</div>
                          ${isStockInHist ? `<div class="text-[10px] text-slate-500 mt-0.5">Terima: <strong>${esc(tglTrx)}</strong></div>` : ''}
                        </td>
                        <td class="py-2.5 px-3 font-medium text-slate-800">${esc(log.user)}</td>
                        <td class="py-2.5 px-3">
                          <div class="font-semibold text-slate-900">${esc(log.reagentName)}</div>
                          <div class="text-[11px] font-mono text-slate-500">Lot: <strong>${esc(log.batchNo)}</strong></div>
                          ${isStockInHist ? `<div class="text-[10px] text-slate-600 mt-0.5">ED Mfg: <strong>${esc(edMfg)}</strong></div>` : ''}
                        </td>
                        ${isStockInHist ? `
                          <td class="py-2.5 px-3">
                            <div class="font-mono text-[11px] text-slate-800">Cat: <strong>${esc(catNo)}</strong></div>
                            <div class="text-[11px] text-slate-600">${esc(mfg)}</div>
                            <div class="text-[11px] font-semibold text-teal-800 mt-0.5">Kemasan: ${esc(vol)}</div>
                          </td>
                          <td class="py-2.5 px-3">
                            <div>${renderCabinetBadge(cab)}</div>
                            <div class="text-[11px] text-slate-700 mt-1">${esc(form)} &bull; ${esc(cat)}</div>
                            <div class="text-[10px] text-slate-500 mt-0.5">Min. Stok: ${esc(minSt)}</div>
                          </td>
                        ` : ''}
                        <td class="py-2.5 px-3 font-mono font-semibold text-slate-800 whitespace-nowrap">${esc(log.changeSummary)}</td>
                        <td class="py-2.5 px-3 text-slate-600 max-w-xs">
                          <div>${esc(ket)}</div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }


    // =========================================================================
    // 8C. HELPER: KATEGORI MULTI, FILTER TAHUN
    // =========================================================================
    function getCats(m) {
      const c = m && m.category;
      if (Array.isArray(c)) return c.filter(Boolean);
      if (!c) return [];
      return String(c).split(/\s*,\s*/).filter(Boolean);
    }
    function catText(m) {
      const c = getCats(m);
      return c.length ? c.join(', ') : '-';
    }
    function catMatch(master, f) {
      if (!f || f === 'ALL') return true;
      const c = getCats(master);
      if (f === 'ALL_B3') return c.some(x => x.startsWith('B3'));
      return c.includes(f);
    }

    function renderMultiCategory(id, selected = ['Reguler']) {
      const opts = ['Reguler', 'Prekursor', ...B3_SUBCLASSES.map(b => `B3 - ${b}`)];
      return `
        <details id="${id}" data-multicat class="relative">
          <summary class="list-none cursor-pointer w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm flex items-center justify-between gap-2 hover:border-teal-500">
            <span id="${id}-label" class="truncate text-slate-800">${esc(selected.join(', ') || 'Pilih kategori...')}</span>
            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 shrink-0"></i>
          </summary>
          <div class="absolute right-0 z-30 mt-1 w-64 max-h-72 overflow-y-auto rounded-xl border border-slate-200 bg-white shadow-xl p-1.5">
            ${opts.map(o => `
              <label class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer text-xs text-slate-800">
                <input type="checkbox" value="${esc(o)}" ${selected.includes(o) ? 'checked' : ''} onchange="onMultiCatChange('${id}', this)" class="w-4 h-4 rounded border-slate-300 text-teal-600" />
                <span>${esc(o)}</span>
              </label>
            `).join('')}
            <div class="px-2.5 pt-1.5 pb-1 text-[10px] text-slate-400">Pilih lebih dari satu bila sifat bahan beragam</div>
          </div>
        </details>`;
    }

    function getMultiCategoryValue(id) {
      const root = document.getElementById(id);
      if (!root) return [];
      return [...root.querySelectorAll('input[type=checkbox]')].filter(b => b.checked).map(b => b.value);
    }

    function onMultiCatChange(id, el) {
      const root = document.getElementById(id);
      if (!root) return;
      const boxes = [...root.querySelectorAll('input[type=checkbox]')];
      if (el.checked) {
        if (el.value === 'Reguler') boxes.forEach(b => { if (b !== el) b.checked = false; });
        else boxes.forEach(b => { if (b.value === 'Reguler') b.checked = false; });
      }
      if (!boxes.some(b => b.checked)) {
        const reg = boxes.find(b => b.value === 'Reguler');
        if (reg) reg.checked = true;
      }
      const lbl = document.getElementById(id + '-label');
      if (lbl) lbl.textContent = getMultiCategoryValue(id).join(', ') || 'Pilih kategori...';
    }

    function getFilterObj(name) {
      switch (name) {
        case 'dbFilters': return dbFilters;
        case 'stockInFilters': return stockInFilters;
        case 'stockOutFilters': return stockOutFilters;
        case 'inUseFilters': return inUseFilters;
        case 'orderFilters': return orderFilters;
        case 'auditFilters': return auditFilters;
        case 'loanFilters': return loanFilters;
        case 'loanListFilters': return loanListFilters;
      }
      return {};
    }

    function yearFilterField(varName) {
      const labels = { inUseFilters: 'Tahun Dibuka', orderFilters: 'Tahun Request', auditFilters: 'Tahun Log', loanListFilters: 'Tahun Pinjam' };
      const label = labels[varName] || 'Tahun ED';
      const years = new Set([String(new Date().getFullYear())]);
      const add = d => { if (d && /^\d{4}/.test(String(d))) years.add(String(d).slice(0, 4)); };
      if (varName === 'inUseFilters') appState.inUse.forEach(i => add(i.openedDate));
      else if (varName === 'orderFilters') (appState.orders || []).forEach(o => add(o.requestDate));
      else if (varName === 'auditFilters') appState.auditLogs.forEach(l => add((l.timestamp || '').split(' ')[0]));
      else if (varName === 'loanListFilters') (appState.loans || []).forEach(l => add(l.loanDate));
      else appState.lots.forEach(l => add(l.ed));
      const cur = getFilterObj(varName).year || 'ALL';
      if (cur !== 'ALL') years.add(cur);
      const opts = [...years].sort();
      return filterField(label, `
        <select onchange="${varName}.year=this.value; renderCurrentRoute();" class="${FILTER_SELECT_CLS}">
          <option value="ALL" ${cur === 'ALL' ? 'selected' : ''}>Semua Tahun</option>
          ${opts.map(y => `<option value="${y}" ${cur === y ? 'selected' : ''}>${y}</option>`).join('')}
        </select>`);
    }

    function stockCabinetOptionsHtml(selected) {
      const opt = c => `<option value="${c}" ${selected === c ? 'selected' : ''}>${c}</option>`;
      return `
        <option value="ALL" ${selected === 'ALL' ? 'selected' : ''}>Semua</option>
        <optgroup label="Stock Cair">${CABINET_GROUPS.STOCK_CAIR.map(opt).join('')}</optgroup>
        <optgroup label="Stock Padat">${CABINET_GROUPS.STOCK_PADAT.map(opt).join('')}</optgroup>
        <optgroup label="Stock Lantai 1 (Glisodin)">${CABINET_GROUPS.STOCK_GLISODIN.map(opt).join('')}</optgroup>`;
    }

    // =========================================================================
    // 8D. VIEW: LIST PEMINJAMAN (CREATE LOAN + MONITOR + RETURN -> STOCK LIST)
    // =========================================================================
    const LOAN_DEPARTMENTS = ['Produksi', 'Research & Development (R&D)', 'Quality Assurance (QA)', 'Mikrobiologi', 'Gudang / Warehouse', 'Engineering', 'Regulatory Affairs', 'Lainnya'];

    function diffDays(a, b) {
      if (!a || !b) return 0;
      const [y1, m1, d1] = a.split('-').map(Number);
      const [y2, m2, d2] = b.split('-').map(Number);
      return Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 86400000);
    }

    function getLoanState(l) {
      const outstanding = Math.max(0, (parseInt(l.qty, 10) || 0) - (parseInt(l.returnedQty, 10) || 0));
      if (outstanding === 0) {
        return { code: 'RETURNED', label: 'Sudah Dikembalikan', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300', outstanding, daysLeft: null };
      }
      const daysLeft = getDaysUntilED(l.dueDate);
      if (daysLeft < 0) {
        return { code: 'LATE', label: `Terlambat ${Math.abs(daysLeft)} hr`, badgeClass: 'bg-rose-100 text-rose-800 border-rose-300', outstanding, daysLeft };
      }
      return {
        code: 'OUT',
        label: daysLeft === 0 ? 'Jatuh tempo hari ini' : `Dipinjam (${daysLeft} hr lagi)`,
        badgeClass: daysLeft <= 2 ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-sky-100 text-sky-800 border-sky-300',
        outstanding, daysLeft
      };
    }

    function getFilteredLoans() {
      const list = (appState.loans || []).filter(l => {
        const st = getLoanState(l);
        if (loanListFilters.status === 'OUT' && st.code === 'RETURNED') return false;
        if (loanListFilters.status === 'LATE' && st.code !== 'LATE') return false;
        if (loanListFilters.status === 'RETURNED' && st.code !== 'RETURNED') return false;
        if (loanListFilters.year && loanListFilters.year !== 'ALL' && (l.loanDate || '').slice(0, 4) !== loanListFilters.year) return false;
        const m = getMasterById(l.masterId);
        if (loanListFilters.search && !matchesQuery(loanListFilters.search, m ? m.name : '', m ? m.catalogNo : '', l.batchNo, l.borrower, l.department, l.purpose, l.lentBy)) return false;
        return true;
      });
      list.sort((a, b) => {
        const ra = getLoanState(a).code === 'RETURNED' ? 1 : 0;
        const rb = getLoanState(b).code === 'RETURNED' ? 1 : 0;
        if (ra !== rb) return ra - rb;
        if (ra === 0) return (a.dueDate || '').localeCompare(b.dueDate || '');
        return (b.returnDate || '').localeCompare(a.returnDate || '');
      });
      return list;
    }

    function renderLoans(container) {
      const states = (appState.loans || []).map(getLoanState);
      const outCount = states.filter(s => s.code !== 'RETURNED').length;
      const lateCount = states.filter(s => s.code === 'LATE').length;
      const tabBtn = (key, icon, text, activeCls) => `
        <button onclick="loanTab='${key}'; renderCurrentRoute();"
          class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ${loanTab === key ? activeCls : 'text-slate-600 hover:text-slate-900'}">
          <i data-lucide="${icon}" class="w-3.5 h-3.5"></i><span>${text}</span>
        </button>`;

      container.innerHTML = `
        <div class="space-y-4">
          <div class="inline-flex flex-wrap rounded-xl bg-slate-100 p-1 border border-slate-200 gap-1">
            ${tabBtn('NEW', 'handshake', 'Buat Peminjaman', 'bg-teal-600 text-white shadow-2xs')}
            ${tabBtn('MONITOR', 'clipboard-list', `Monitor Peminjaman (${outCount} aktif${lateCount ? ' &bull; ' + lateCount + ' terlambat' : ''})`, 'bg-navy-900 text-white shadow-2xs')}
          </div>
          ${loanTab === 'NEW' ? renderLoanNewTab() : renderLoanMonitorTab()}
        </div>`;
    }

    function renderLoanNewTab() {
      const allAvail = appState.lots.filter(l => !l.quarantined && Number(l.qty) > 0);
      Object.keys(loanSelection).forEach(id => {
        const lot = allAvail.find(l => l.id === id);
        if (!lot || getDaysUntilED(lot.ed) < 0) delete loanSelection[id];
        else if (loanSelection[id].qty > lot.qty) loanSelection[id].qty = lot.qty;
      });
      const lots = filterAndSortLots(loanFilters);
      const ids = Object.keys(loanSelection);
      const totalBtl = ids.reduce((sum, id) => sum + (loanSelection[id].qty || 0), 0);
      const hasF = loanFilters.search || loanFilters.edStatus !== 'ALL' || loanFilters.cabinet !== 'ALL' || (loanFilters.year && loanFilters.year !== 'ALL');
      const sel = FILTER_SELECT_CLS;

      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-2xs space-y-4">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-violet-50 text-violet-700 flex items-center justify-center shrink-0"><i data-lucide="handshake" class="w-5 h-5"></i></div>
              <div>
                <h2 class="text-sm font-bold text-slate-900">Buat Peminjaman Reagen</h2>
                <p class="text-xs text-slate-500">Pilih lot stock yang dipinjam &bull; stok otomatis berkurang &bull; menampilkan <strong>${lots.length}</strong> lot</p>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-3 shrink-0 self-end md:self-center">
              <div class="text-right">
                <div class="text-[11px] text-slate-500">Dipilih</div>
                <div class="text-sm font-bold text-slate-900">${ids.length} Lot (${totalBtl} btl)</div>
              </div>
              <button onclick="openLoanConfirmModal()" ${ids.length === 0 ? 'disabled' : ''}
                class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all inline-flex items-center gap-2 ${ids.length > 0 ? 'bg-violet-600 hover:bg-violet-700 text-white shadow-sm cursor-pointer' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}">
                <i data-lucide="handshake" class="w-4 h-4"></i><span>Proses Peminjaman</span>
              </button>
            </div>
          </div>

          <div class="pt-3 border-t border-slate-100 space-y-3">
            <div class="relative">
              <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              <input type="text" data-focus-key="ln-search" autocomplete="off" value="${esc(loanFilters.search)}" oninput="liveSearch(loanFilters, this.value)"
                placeholder="Cari Nama Reagen, Cat no., Batch/Lot, atau Lemari..."
                class="w-full pl-10 pr-8 py-2.5 text-xs sm:text-sm rounded-xl border border-slate-300 bg-white focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/15" />
              ${loanFilters.search ? `<button type="button" onclick="clearSearch(loanFilters)" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-rose-600"><i data-lucide="x" class="w-4 h-4"></i></button>` : ''}
            </div>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 items-end">
              ${filterField('Status ED', `
                <select onchange="loanFilters.edStatus=this.value; renderCurrentRoute();" class="${sel}">
                  <option value="ALL" ${loanFilters.edStatus === 'ALL' ? 'selected' : ''}>Semua</option>
                  <option value="SAFE" ${loanFilters.edStatus === 'SAFE' ? 'selected' : ''}>Aman (&gt; 30 Hr)</option>
                  <option value="NEAR_ED" ${loanFilters.edStatus === 'NEAR_ED' ? 'selected' : ''}>Near ED (&le; 30 Hr)</option>
                  <option value="EXPIRED" ${loanFilters.edStatus === 'EXPIRED' ? 'selected' : ''}>Expired / Terkunci</option>
                </select>`)}
              ${filterField('Lemari Stock', `<select onchange="loanFilters.cabinet=this.value; renderCurrentRoute();" class="${sel}">${stockCabinetOptionsHtml(loanFilters.cabinet)}</select>`)}
              ${yearFilterField('loanFilters')}
              <div></div>
              <div>
                ${hasF ? `<button onclick="loanFilters={search:'',edStatus:'ALL',stockStatus:'ALL',cabinet:'ALL',category:'ALL',sortBy:'FEFO',year:'ALL'}; renderCurrentRoute();" class="w-full px-3 py-2.5 rounded-xl text-xs font-semibold text-rose-600 border border-rose-200 hover:bg-rose-50">Reset Filter</button>` : ''}
              </div>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-2xs overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full min-w-[900px] text-left border-collapse">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                  <th class="py-3 px-4 w-12 text-center">Pilih</th>
                  <th class="py-3 px-3">Nama Reagen & Cat no.</th>
                  <th class="py-3 px-3">Batch / Lot</th>
                  <th class="py-3 px-3">ED Manufacturer</th>
                  <th class="py-3 px-3">Lokasi & Kategori</th>
                  <th class="py-3 px-3">Kemasan</th>
                  <th class="py-3 px-3 text-center">Stock</th>
                  <th class="py-3 px-4 text-center w-36">Qty Pinjam</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 text-xs">
                ${lots.length === 0 ? `<tr><td colspan="8" class="py-10 text-center text-slate-500">Tidak ada batch/lot yang cocok.</td></tr>` : lots.map(lot => {
                  const master = getMasterById(lot.masterId);
                  if (!master) return '';
                  const edStatus = getEDStatus(lot.ed);
                  const isExpired = edStatus.code === 'EXPIRED';
                  const isChecked = Object.prototype.hasOwnProperty.call(loanSelection, lot.id);
                  const q = isChecked ? loanSelection[lot.id].qty : 1;
                  return `
                    <tr class="transition-colors ${isExpired ? 'bg-rose-50/80 text-slate-400 select-none' : isChecked ? 'bg-violet-50/60' : 'hover:bg-slate-50'}">
                      <td class="py-3 px-4 text-center">
                        <input type="checkbox" ${isExpired ? 'disabled' : ''} ${isChecked ? 'checked' : ''} onchange="toggleLoanLot('${lot.id}', this.checked)"
                          class="w-4 h-4 rounded border-slate-300 text-violet-600 ${isExpired ? 'cursor-not-allowed opacity-40' : 'cursor-pointer'}" />
                      </td>
                      <td class="py-3 px-3">
                        <div class="font-semibold ${isExpired ? 'text-slate-500 line-through' : 'text-slate-900'}">${esc(master.name)}</div>
                        <div class="text-[11px] font-mono text-slate-500 mt-0.5">Cat no. ${esc(master.catalogNo)}</div>
                      </td>
                      <td class="py-3 px-3 font-mono font-semibold ${isExpired ? 'text-rose-700' : 'text-slate-800'}">${esc(lot.batchNo)}</td>
                      <td class="py-3 px-3">
                        <div class="font-semibold ${isExpired ? 'text-rose-700' : 'text-slate-800'}">${formatDateID(lot.ed)}</div>
                        ${isExpired
                          ? `<span class="mt-0.5 inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-bold bg-rose-600 text-white"><i data-lucide="lock" class="w-2.5 h-2.5"></i> TERKUNCI</span>`
                          : `<span class="mt-0.5 inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold border ${edStatus.badgeClass}">${edStatus.label}</span>`}
                      </td>
                      <td class="py-3 px-3">
                        <div class="mb-1">${renderCabinetBadge(master.cabinet)}</div>
                        ${renderCategoryBadge(master.category)}
                      </td>
                      <td class="py-3 px-3 font-medium text-slate-700">${esc(master.volumePerBottle)}</td>
                      <td class="py-3 px-3 text-center font-mono font-bold text-slate-800">${lot.qty} <span class="font-normal text-slate-500">btl</span></td>
                      <td class="py-3 px-4 text-center">
                        ${isExpired ? `<span class="text-[11px] font-semibold text-rose-600">Terkunci</span>` : isChecked ? `
                          <div class="inline-flex items-center border border-violet-500 rounded-lg bg-white overflow-hidden">
                            <button type="button" onclick="updateLoanQty('${lot.id}', ${q - 1})" class="px-2 py-1 text-slate-600 hover:bg-slate-100 font-bold">-</button>
                            <input type="number" min="1" max="${lot.qty}" value="${q}" onchange="updateLoanQty('${lot.id}', parseInt(this.value, 10))" class="w-10 text-center text-xs font-mono font-bold text-slate-900 focus:outline-none" />
                            <button type="button" onclick="updateLoanQty('${lot.id}', ${q + 1})" class="px-2 py-1 text-slate-600 hover:bg-slate-100 font-bold">+</button>
                          </div>` : `<span class="text-slate-400 text-[11px]">Centang dahulu</span>`}
                      </td>
                    </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    function toggleLoanLot(lotId, checked) {
      if (checked) loanSelection[lotId] = { qty: 1 };
      else delete loanSelection[lotId];
      renderCurrentRoute();
    }

    function updateLoanQty(lotId, newQty) {
      const lot = appState.lots.find(l => l.id === lotId);
      if (!lot || !loanSelection[lotId]) return;
      if (isNaN(newQty) || newQty < 1) loanSelection[lotId].qty = 1;
      else if (newQty > lot.qty) { loanSelection[lotId].qty = lot.qty; showToast(`Maksimal ${lot.qty} botol untuk batch ${esc(lot.batchNo)}.`, 'warning'); }
      else loanSelection[lotId].qty = newQty;
      renderCurrentRoute();
    }

    function openLoanConfirmModal() {
      const ids = Object.keys(loanSelection);
      if (ids.length === 0) return;
      const items = ids.map(id => {
        const lot = appState.lots.find(l => l.id === id);
        return { lot, master: lot ? getMasterById(lot.masterId) : null, qty: loanSelection[id].qty };
      }).filter(x => x.lot && x.master);
      const total = items.reduce((sum, x) => sum + x.qty, 0);

      openModal(`
        <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-violet-50">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-violet-600 text-white flex items-center justify-center"><i data-lucide="handshake" class="w-5 h-5"></i></div>
            <div>
              <h3 class="text-sm font-bold text-slate-900">Form Peminjaman Reagen</h3>
              <p class="text-xs text-slate-600">${items.length} lot &bull; ${total} botol akan dipotong dari Stock List</p>
            </div>
          </div>
          <button onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <form onsubmit="submitLoan(event)" class="p-5 space-y-4 text-xs sm:text-sm max-h-[80vh] overflow-y-auto">
          <div class="max-h-36 overflow-y-auto border border-slate-200 rounded-xl divide-y divide-slate-100">
            ${items.map(({ lot, master, qty }) => `
              <div class="p-2.5 flex items-center justify-between gap-2 bg-white">
                <div>
                  <div class="font-bold text-slate-900 text-xs">${esc(master.name)}</div>
                  <div class="text-[11px] font-mono text-slate-500">Lot: ${esc(lot.batchNo)} &bull; ED: ${formatDateID(lot.ed)} &bull; ${esc(master.volumePerBottle)}</div>
                </div>
                <span class="px-2.5 py-1 rounded-lg bg-violet-100 text-violet-800 font-mono font-bold text-xs shrink-0">${qty} btl</span>
              </div>`).join('')}
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Peminjam <span class="text-rose-600">*</span></label>
              <input type="text" id="loan-borrower" required placeholder="Nama lengkap peminjam" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs sm:text-sm focus:outline-none focus:border-violet-600" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Departemen / Unit <span class="text-rose-600">*</span></label>
              <input type="text" id="loan-dept" list="loan-dept-list" required placeholder="Pilih atau ketik departemen" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs sm:text-sm focus:outline-none focus:border-violet-600" />
              <datalist id="loan-dept-list">${LOAN_DEPARTMENTS.map(d => `<option value="${esc(d)}"></option>`).join('')}</datalist>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Tujuan Peminjaman <span class="text-rose-600">*</span></label>
            <input type="text" id="loan-purpose" required placeholder="Misal: Pembuatan larutan dapar uji stabilitas" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs sm:text-sm focus:outline-none focus:border-violet-600" />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Tanggal Pinjam <span class="text-rose-600">*</span></label>
              <input type="date" id="loan-date" required value="${getRelativeDateStr(0)}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs sm:text-sm focus:outline-none focus:border-violet-600" />
            </div>

    function submitLoan(e) {
      e.preventDefault();
      const borrower = document.getElementById('loan-borrower').value.trim();
      const dept = document.getElementById('loan-dept').value.trim();
      const purpose = document.getElementById('loan-purpose').value.trim();
      const loanDate = document.getElementById('loan-date').value;
      const dueDate = document.getElementById('loan-due').value;
      const contact = document.getElementById('loan-contact').value.trim();
      const notes = document.getElementById('loan-notes').value.trim();
      const analyst = rememberAnalyst(document.getElementById('loan-analyst').value);

      if (!borrower || !dept || !purpose || !loanDate || !dueDate) { showToast('Lengkapi data peminjam, departemen, tujuan, dan tanggal.', 'error'); return; }
      if (dueDate < loanDate) { showToast('Rencana kembali tidak boleh sebelum tanggal pinjam.', 'error'); return; }
      if (!document.getElementById('loan-analyst').value) { showToast('Pilih nama analis (tambah dulu di kanan atas bila kosong).', 'error'); return; }

      const nowTs = getCurrentTimestampStr(0);
      let totalBtl = 0;
      Object.keys(loanSelection).forEach((lotId, idx) => {
        const lot = appState.lots.find(l => l.id === lotId);
        const master = lot ? getMasterById(lot.masterId) : null;
        const take = loanSelection[lotId].qty;
        if (!lot || !master || take <= 0 || take > lot.qty) return;

        const oldQty = lot.qty;
        lot.qty -= take;
        lot.dateModified = nowTs;
        totalBtl += take;

        appState.loans.unshift({
          id: 'LN-' + Date.now().toString().slice(-6) + '-' + idx,
          masterId: master.id,
          lotId: lot.id,
          batchNo: lot.batchNo,
          ed: lot.ed,
          qty: take,
          returnedQty: 0,
          borrower,
          department: dept,
          contact,
          purpose,
          loanDate,
          dueDate,
          returnDate: null,
          lentBy: analyst,
          notes,
          returns: []
        });

        addAuditLog('PEMINJAMAN', master.name, lot.batchNo, `${oldQty} → ${lot.qty} Botol (${take} dipinjam)`,
          `Peminjam: ${borrower} (${dept}) | Tujuan: ${purpose} | Jatuh tempo: ${formatDateID(dueDate)}${notes ? ' | Ket: ' + notes : ''}`, analyst);
      });

      loanSelection = {};
      saveState();
      closeModal();
      loanTab = 'MONITOR';
      loanListFilters.status = 'ALL';
      navigateTo('loans');
      showToast(`<strong>${totalBtl} botol</strong> dipinjamkan kepada <strong>${esc(borrower)}</strong>.`, 'success');
    }

    function submitReturnLoan(e, loanId) {
      e.preventDefault();
      const l = (appState.loans || []).find(x => x.id === loanId);
      const master = l ? getMasterById(l.masterId) : null;
      if (!l || !master) return;
      const st = getLoanState(l);
      const analystVal = document.getElementById('ret-analyst').value;
      const retDate = document.getElementById('ret-date').value;
      const qty = parseInt(document.getElementById('ret-qty').value, 10);
      const toStock = document.getElementById('ret-to-stock').checked;
      const note = document.getElementById('ret-note').value.trim();

      if (!analystVal) { showToast('Pilih nama analis (tambah dulu di kanan atas bila kosong).', 'error'); return; }
      if (!retDate || isNaN(qty) || qty < 1 || qty > st.outstanding) { showToast(`Jumlah kembali harus 1 sampai ${st.outstanding} botol.`, 'error'); return; }
      const analyst = rememberAnalyst(analystVal);
      const nowTs = getCurrentTimestampStr(0);

      l.returnedQty = (l.returnedQty || 0) + qty;
      if (!Array.isArray(l.returns)) l.returns = [];
      l.returns.push({ date: retDate, qty, by: analyst, note, toStock });
      if (l.returnedQty >= l.qty) l.returnDate = retDate;

      let addedLotId = null;
      if (toStock) {
        let lot = appState.lots.find(x => x.id === l.lotId && !x.quarantined);
        if (!lot) lot = appState.lots.find(x => x.masterId === l.masterId && x.batchNo === l.batchNo && x.ed === l.ed && !x.quarantined);
        let oldQty = 0;
        if (lot) {
          oldQty = lot.qty;
          lot.qty += qty;
          lot.dateModified = nowTs;
        } else {
          lot = {
            id: 'LOT-' + Date.now().toString().slice(-6),
            masterId: l.masterId,
            batchNo: l.batchNo,
            ed: l.ed,
            qty,
            quarantined: false,
            dateModified: nowTs,
            receivedDate: l.loanDate,
            notes: 'Pengembalian peminjaman ' + l.id
          };
          appState.lots.push(lot);
        }
        addedLotId = lot.id;
        addAuditLog('PENGEMBALIAN', master.name, l.batchNo, `${oldQty} → ${lot.qty} Botol (+${qty} kembali dari ${l.borrower})`,
          note || 'Pengembalian peminjaman, stok ditambahkan ke Stock List', analyst);
      } else {
        addAuditLog('PENGEMBALIAN', master.name, l.batchNo, `${qty} Botol kembali dari ${l.borrower} (tidak masuk Stock List)`,
          note || 'Pengembalian tanpa penambahan stok', analyst);
      }

      saveState();
      closeModal();
      renderCurrentRoute();
      showToast(toStock
        ? `<strong>+${qty} btl</strong> ${esc(master.name)} kembali ke Stock List. <button type="button" onclick="goToStockFromLoan('${l.id}')" class="underline font-semibold">Lihat di Stock List</button>`
        : `Pengembalian <strong>${esc(master.name)}</strong> dicatat (tanpa penambahan stok).`, 'success');
    }

      'CREATE_PBJ':       { label: 'Create PBJ', cls: 'bg-navy-900 text-white border-navy-900' },
      'PEMINJAMAN':       { label: 'Peminjaman', cls: 'bg-violet-100 text-violet-800 border-violet-200' },
      'PENGEMBALIAN':     { label: 'Pengembalian', cls: 'bg-lime-100 text-lime-800 border-lime-200' }
    };

    function getFilteredAuditLogs() {
      return appState.auditLogs.filter(log => {
        const logDate = log.timestamp.split(' ')[0];
        if (auditFilters.dateFrom && logDate < auditFilters.dateFrom) return false;
        if (auditFilters.dateTo && logDate > auditFilters.dateTo) return false;
        if (auditFilters.year && auditFilters.year !== 'ALL' && logDate.slice(0, 4) !== auditFilters.year) return false;
        if (auditFilters.actionType !== 'ALL' && log.actionType !== auditFilters.actionType) return false;
        if (auditFilters.user !== 'ALL' && log.user !== auditFilters.user) return false;
        if (auditFilters.search && !matchesQuery(auditFilters.search, log.reagentName, log.batchNo, log.notes, log.user)) return false;
        return true;
      });
    }

    function renderAuditTrail(container) {
      const logs = getFilteredAuditLogs();
      const uniqueUsers = [...new Set(appState.auditLogs.map(l => l.user))];

      container.innerHTML = `
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs flex flex-col lg:flex-row lg:items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-navy-900 text-teal-400 flex items-center justify-center shrink-0">
              <i data-lucide="shield-check" class="w-5 h-5"></i>
            </div>
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <h2 class="text-sm font-bold text-slate-900">Jejak Audit Elektronik</h2>
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                  <i data-lucide="lock" class="w-2.5 h-2.5"></i> Log Terkunci (Read-Only)
                </span>
              </div>
              <p class="text-xs text-slate-500">Seluruh pergerakan reagen & nama analis terekam kronologis</p>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-2 shrink-0">
            ${renderExportButtons('audit')}
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Dari Tanggal</label>
            <input type="date" value="${auditFilters.dateFrom}" onchange="auditFilters.dateFrom=this.value; renderCurrentRoute();"
              class="w-full rounded-xl border border-slate-200 px-3 py-1.5 text-xs focus:outline-none focus:border-teal-600" />
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Sampai Tanggal</label>
            <input type="date" value="${auditFilters.dateTo}" onchange="auditFilters.dateTo=this.value; renderCurrentRoute();"
              class="w-full rounded-xl border border-slate-200 px-3 py-1.5 text-xs focus:outline-none focus:border-teal-600" />
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Aktivitas</label>
            <select onchange="auditFilters.actionType=this.value; renderCurrentRoute();" class="w-full rounded-xl border border-slate-200 px-3 py-1.5 text-xs bg-slate-50">
              <option value="ALL" ${auditFilters.actionType==='ALL'?'selected':''}>Semua Aktivitas</option>
              ${Object.keys(ACTION_BADGES).map(k => `<option value="${k}" ${auditFilters.actionType===k?'selected':''}>${ACTION_BADGES[k].label}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Nama Analis</label>
            <select onchange="auditFilters.user=this.value; renderCurrentRoute();" class="w-full rounded-xl border border-slate-200 px-3 py-1.5 text-xs bg-slate-50">
              <option value="ALL" ${auditFilters.user==='ALL'?'selected':''}>Semua Analis</option>
              ${uniqueUsers.map(u => `<option value="${esc(u)}" ${auditFilters.user===u?'selected':''}>${esc(u)}</option>`).join('')}
            </select>
          </div>
          <div>${yearFilterField('auditFilters')}</div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Cari Reagen / Lot</label>
            <div class="relative">
              <input type="text" data-focus-key="au-search" autocomplete="off" value="${esc(auditFilters.search)}" oninput="liveSearch(auditFilters, this.value)"
                placeholder="Ketik nama / lot..."
                class="w-full rounded-xl border border-slate-200 pl-3 pr-8 py-1.5 text-xs focus:outline-none focus:border-teal-600" />
              ${(auditFilters.dateFrom || auditFilters.dateTo || auditFilters.actionType!=='ALL' || auditFilters.user!=='ALL' || auditFilters.search || (auditFilters.year && auditFilters.year!=='ALL')) ? `
                <button onclick="auditFilters={dateFrom:'',dateTo:'',actionType:'ALL',search:'',user:'ALL'}; renderCurrentRoute();" class="absolute right-2 top-1/2 -translate-y-1/2 text-rose-500 hover:text-rose-700" title="Reset Filter">
                  <i data-lucide="x-circle" class="w-3.5 h-3.5"></i>
                </button>
              ` : ''}
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-2xs overflow-hidden">
          <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 text-xs text-slate-500 flex justify-between items-center">
            <span>Menampilkan <strong>${logs.length}</strong> catatan audit</span>
            <span class="font-mono text-[11px]">Kronologis & Permanen</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50/70 border-b border-slate-200 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                  <th class="py-3 px-3.5">Tanggal & Jam</th>
                  <th class="py-3 px-3">Nama Analis</th>
                  <th class="py-3 px-3">Aktivitas</th>
                  <th class="py-3 px-3">Reagen & Lot</th>
                  <th class="py-3 px-3">Perubahan</th>
                  <th class="py-3 px-3.5">Keterangan</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 text-xs">
                ${logs.length === 0 ? `
                  <tr><td colspan="6" class="py-12 text-center text-slate-500">Tidak ada catatan audit pada filter yang dipilih.</td></tr>
                ` : logs.map(log => {
                  const badge = ACTION_BADGES[log.actionType] || { label: log.actionType, cls: 'bg-slate-100 text-slate-700 border-slate-200' };
                  return `
                    <tr class="hover:bg-slate-50 transition-colors">
                      <td class="py-3 px-3.5 font-mono text-[11px] text-slate-700 whitespace-nowrap">${esc(log.timestamp)}</td>
                      <td class="py-3 px-3 font-medium text-slate-800">${esc(log.user)}</td>
                      <td class="py-3 px-3"><span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold border ${badge.cls}">${badge.label}</span></td>
                      <td class="py-3 px-3">
                        <div class="font-semibold text-slate-900">${esc(log.reagentName)}</div>
                        <div class="text-[11px] font-mono text-slate-500">Lot: ${esc(log.batchNo)}</div>
                      </td>
                      <td class="py-3 px-3 font-mono font-semibold text-slate-800">${esc(log.changeSummary)}</td>
                      <td class="py-3 px-3.5 text-slate-600 max-w-xs">${esc(log.notes)}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 10. RESET DEMO DATA MODAL (QC SPV / QC MANAGER + PASSWORD)
    // =========================================================================
    const RESET_DEMO_PASSWORD = 'PANCASRADHA';

    function openResetModal() {
      openModal(`
        <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-amber-50">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-amber-500 text-white flex items-center justify-center"><i data-lucide="shield-alert" class="w-5 h-5"></i></div>
            <div>
              <h3 class="text-sm font-bold text-slate-900">Reset Data Demo</h3>
              <p class="text-xs text-slate-600">Khusus akses QC SPV atau QC Manager</p>
            </div>
          </div>
          <button onclick="closeModal()" class="p-1 text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <form onsubmit="submitResetDemoAuth(event)" class="p-5 space-y-4 text-xs sm:text-sm">
          <p class="text-slate-600">Seluruh perubahan stok, pemesanan, PBJ, peminjaman, dan log akan di-reset ke data simulasi awal.</p>

          <div>
            <label for="reset-role" class="block text-xs font-semibold text-slate-700 mb-1">Jabatan / Otoritas <span class="text-rose-600">*</span></label>
            <select id="reset-role" required class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs sm:text-sm font-medium text-slate-900 focus:outline-none focus:border-amber-600">
              <option value="QC SPV">QC SPV</option>
              <option value="QC Manager">QC Manager</option>
            </select>
          </div>

          <div>
            <label for="reset-password" class="block text-xs font-semibold text-slate-700 mb-1">Password Otorisasi <span class="text-rose-600">*</span></label>
            <input type="password" id="reset-password" required autocomplete="off" placeholder="Masukkan password otorisasi..."
              class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs sm:text-sm font-mono focus:outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-600/15" />
            <div id="reset-auth-error" class="hidden mt-1.5 text-xs font-semibold text-rose-600"></div>
          </div>

          <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Batal</button>
            <button type="submit" class="px-4 py-2 rounded-xl text-xs font-semibold bg-amber-600 hover:bg-amber-700 text-white shadow-xs">Reset Sekarang</button>
          </div>
        </form>
      `);
      setTimeout(() => document.getElementById('reset-password')?.focus(), 0);
    }

    function submitResetDemoAuth(e) {
      e.preventDefault();
      const role = (document.getElementById('reset-role')?.value || '').trim();
      const pwd = (document.getElementById('reset-password')?.value || '').trim();
      const errEl = document.getElementById('reset-auth-error');

      if (!['QC SPV', 'QC Manager'].includes(role)) {
        if (errEl) { errEl.textContent = 'Akses hanya untuk QC SPV atau QC Manager.'; errEl.classList.remove('hidden'); }
        return;
      }
      if (pwd !== RESET_DEMO_PASSWORD) {
        if (errEl) { errEl.textContent = 'Password salah. Reset data demo ditolak.'; errEl.classList.remove('hidden'); }
        showToast('Password otorisasi Reset Data Demo salah.', 'error');
        return;
      }
      confirmResetDemoData(role);
    }

    function confirmResetDemoData(authorizedRole = 'QC SPV') {
      localStorage.removeItem(STORAGE_KEY);
      appState = createInitialSeedData();
      saveState(appState);
      cutStockSelection = {};
      orderSelection = {};
      dbFilters = { search: '', edStatus: 'ALL', stockStatus: 'ALL', cabinet: 'ALL', category: 'ALL', sortBy: 'FEFO' };
      stockInFilters = { search: '', edStatus: 'ALL', stockStatus: 'ALL', cabinet: 'ALL', category: 'ALL', sortBy: 'FEFO' };
      stockOutFilters = { search: '', edStatus: 'ALL', stockStatus: 'ALL', cabinet: 'ALL', category: 'ALL', sortBy: 'FEFO' };
      inUseFilters = { tab: 'ACTIVE', search: '', cabinet: 'ALL', physicalForm: 'ALL', category: 'ALL' };
      orderFilters = { status: 'ALL', search: '' };
      loanTab = 'NEW'; loanSelection = {};
      loanFilters = { search: '', edStatus: 'ALL', stockStatus: 'ALL', cabinet: 'ALL', category: 'ALL', sortBy: 'FEFO', year: 'ALL' };
      loanListFilters = { status: 'ALL', search: '', year: 'ALL' };
      auditFilters = { dateFrom: '', dateTo: '', actionType: 'ALL', search: '', user: 'ALL' };
      refreshAnalystDatalist();
      closeModal();
      navigateTo('dashboard');
      showToast('Data berhasil dikembalikan ke kondisi awal.', 'info');
    }

    // =========================================================================
    // 11. BOOTSTRAP ON LOAD
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      const todayFormatted = new Date().toLocaleDateString('id-ID', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
      document.getElementById('current-date-display').textContent = todayFormatted;

      refreshAnalystDatalist();
      renderAnalystManager();
      document.addEventListener('click', (e) => {
        document.querySelectorAll('details[data-multicat][open]').forEach(d => { if (!d.contains(e.target)) d.removeAttribute('open'); });
        if (analystPanelOpen) { analystPanelOpen = false; renderAnalystManager(); }
      });
      if (!handleDeepLink()) navigateTo('dashboard');
      window.addEventListener('hashchange', handleDeepLink);
    });
  </script>
</body>
</html>
