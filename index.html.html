  <script>
    // =========================================================================
    // 1. INITIALIZATION, CONSTANTS, DATE HELPERS & STORAGE STATE
    // =========================================================================
    const STORAGE_KEY = 'ereagent_lims_state_v4';

    const DEFAULT_ANALYSTS = [
      'Sinta (Analis QC)',
      'Reza (Analis Lab)',
      'Budi (Supervisor QC)',
      'Nadia (Analis Mikrobiologi)',
      'Dimas (Analis Kimia)'
    ];

    const CABINET_GROUPS = {
      STOCK_CAIR: ['Lemari B', 'Lemari C', 'Lemari E1', 'Lemari E2'],
      STOCK_PADAT: ['Lemari A padat', 'Lemari B padat', 'Lemari C padat', 'Lemari D padat', 'Lemari E padat', 'Lemari F padat', 'Lemari G padat', 'Lemari H padat'],
      INUSE_CAIR: ['Lemari A', 'Lemari F2'],
      INUSE_PADAT: ['Lemari F1', 'Lemari G1', 'Lemari G2', 'Lemari H1', 'Lemari H2']
    };

    const B3_SUBCLASSES = [
      'Toxic',
      'Corrosive',
      'Harmful',
      'Irritant',
      'Flammable',
      'Oxidator',
      'Berbahaya bagi lingkungan',
      'Karsinogenik'
    ];

    function getRelativeDateStr(daysOffset) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + daysOffset);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getCurrentTimestampStr(daysOffset = 0, timeStr = null) {
      const datePart = getRelativeDateStr(daysOffset);
      if (timeStr) return `${datePart} ${timeStr}`;
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${datePart} ${hh}:${mm}:${ss}`;
    }

    function getDaysUntilED(edStr) {
      if (!edStr) return 9999;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const [y, m, d] = edStr.split('-').map(Number);
      const edDate = new Date(y, m - 1, d);
      edDate.setHours(0, 0, 0, 0);
      return Math.ceil((edDate.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
    }

    function formatDateID(dateStr) {
      if (!dateStr) return '-';
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parts[2]} ${months[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    function getEDStatus(edStr) {
      const days = getDaysUntilED(edStr);
      if (days < 0) {
        return { code: 'EXPIRED', label: 'Expired / Terkunci', days, badgeClass: 'bg-rose-100 text-rose-800 border-rose-300' };
      } else if (days <= 30) {
        return { code: 'NEAR_ED', label: `Near ED (${days} hr)`, days, badgeClass: 'bg-amber-100 text-amber-800 border-amber-300' };
      } else {
        return { code: 'SAFE', label: 'Aman', days, badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300' };
      }
    }

    function createInitialSeedData() {
      return normalizeState({
        analysts: [...DEFAULT_ANALYSTS],
        lastAnalyst: '',
        masters: [],
        lots: [],
        inUse: [],
        orders: [],
        auditLogs: []
      });
    }

    // Global State
    let appState = loadState();
    let currentRoute = 'dashboard';

    // Filter & Sort states
    let dbFilters = { search: '', edStatus: 'ALL', stockStatus: 'ALL', cabinet: 'ALL', category: 'ALL', sortBy: 'FEFO' };
    let stockInFilters = { search: '', edStatus: 'ALL', stockStatus: 'ALL', cabinet: 'ALL', category: 'ALL', sortBy: 'FEFO' };
    let stockOutFilters = { search: '', edStatus: 'ALL', stockStatus: 'ALL', cabinet: 'ALL', category: 'ALL', sortBy: 'FEFO' };
    let inUseFilters = { tab: 'ACTIVE', search: '', cabinet: 'ALL', physicalForm: 'ALL', category: 'ALL' };
    let orderFilters = { status: 'ALL', search: '' };
    let auditFilters = { dateFrom: '', dateTo: '', actionType: 'ALL', search: '', user: 'ALL' };
    let stockInMode = 'EXISTING';
    let cutStockSelection = {};
    let orderSelection = {};
    let selectedExistingMasterId = '';
    let existingMasterSearchText = '';
    let newReagentFormState = { physicalForm: 'Cair' };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          return normalizeState(JSON.parse(raw));
        }
      } catch (e) {
        console.error('Failed to load state:', e);
      }
      const initial = createInitialSeedData();
      saveState(initial);
      return initial;
    }

    function saveState(stateObj = appState) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stateObj));
      } catch (e) {
        console.error('Failed to save state:', e);
      }
    }

    // Editable Analyst Input Helper + Memory
    function rememberAnalyst(name) {
      const clean = String(name || '').trim();
      if (!clean) return 'Analis QC';
      appState.lastAnalyst = clean;
      if (!Array.isArray(appState.analysts)) appState.analysts = [...DEFAULT_ANALYSTS];
      if (!appState.analysts.some(a => a.toLowerCase() === clean.toLowerCase())) {
        appState.analysts.unshift(clean);
      }
      refreshAnalystDatalist();
      saveState();
      return clean;
    }

    function refreshAnalystDatalist() {
      const dl = document.getElementById('analyst-options-list');
      if (!dl) return;
      const list = Array.isArray(appState.analysts) && appState.analysts.length ? appState.analysts : DEFAULT_ANALYSTS;
      dl.innerHTML = list.map(a => `<option value="${esc(a)}"></option>`).join('');
    }

    function renderAnalystInput(inputId, label = 'Nama Analis', required = true) {
      const defaultVal = appState.lastAnalyst || (appState.analysts && appState.analysts[0]) || DEFAULT_ANALYSTS[0];
      return `
        <div>
          <label for="${inputId}" class="block text-xs font-semibold text-slate-700 mb-1">
            ${label} ${required ? '<span class="text-rose-600">*</span>' : ''}
            <span class="font-normal text-slate-400">(pilih atau ketik nama baru)</span>
          </label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input type="text" id="${inputId}" list="analyst-options-list" value="${esc(defaultVal)}" ${required ? 'required' : ''}
              placeholder="Pilih dari daftar atau ketik nama analis..."
              class="w-full rounded-xl border border-slate-300 bg-white pl-9 pr-3 py-2 text-xs sm:text-sm font-medium text-slate-900 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/15" />
          </div>
        </div>
      `;
    }

    function addAuditLog(actionType, reagentName, batchNo, changeSummary, notes = '', analystName = null) {
      const actor = rememberAnalyst(analystName || appState.lastAnalyst || DEFAULT_ANALYSTS[0]);
      const newLog = {
        id: 'LOG-' + Date.now().toString().slice(-6) + Math.floor(Math.random() * 90 + 10),
        timestamp: getCurrentTimestampStr(0),
        user: actor,
        actionType,
        reagentName,
        batchNo,
        changeSummary,
        notes: notes || '-'
      };
      appState.auditLogs.unshift(newLog);
      saveState();
    }

    // =========================================================================
    // 2. COMPUTED ANALYTICS & INVENTORY HELPERS
    // =========================================================================
    function getMasterById(masterId) {
      return appState.masters.find(m => m.id === masterId);
    }

    function getValidSealedQtyByMaster(masterId) {
      return appState.lots
        .filter(l => String(l.masterId) === String(masterId) && !l.quarantined && Number(l.qty) > 0 && getDaysUntilED(l.ed) >= 0)
        .reduce((sum, l) => sum + (parseInt(l.qty, 10) || 0), 0);
    }

    function getMasterStockStatus(masterId) {
      const master = getMasterById(masterId);
      if (!master) return { isLow: false, validQty: 0, minStock: 0 };
      const validQty = getValidSealedQtyByMaster(masterId);
      const minStock = parseInt(master.minStock, 10) || 0;
      return { isLow: validQty <= minStock, validQty, minStock };
    }

    function getDefaultInUseCabinet(physicalForm) {
      return physicalForm === 'Padat' ? CABINET_GROUPS.INUSE_PADAT[0] : CABINET_GROUPS.INUSE_CAIR[0];
    }

    function getAllowedInUseCabinets(physicalForm) {
      return physicalForm === 'Padat' ? CABINET_GROUPS.INUSE_PADAT : CABINET_GROUPS.INUSE_CAIR;
    }

    function getAllowedStockCabinets(physicalForm) {
      return physicalForm === 'Padat' ? CABINET_GROUPS.STOCK_PADAT : CABINET_GROUPS.STOCK_CAIR;
    }

    function getDashboardMetrics() {
      const activeLots = appState.lots.filter(l => !l.quarantined && Number(l.qty) > 0);
      const validLots = activeLots.filter(l => getDaysUntilED(l.ed) >= 0);
      const nearEdLots = validLots.filter(l => getDaysUntilED(l.ed) <= 30);
      const expiredLots = activeLots.filter(l => getDaysUntilED(l.ed) < 0);
      
      const totalSealedBottles = validLots.reduce((s, l) => s + (parseInt(l.qty, 10) || 0), 0);
      const activeMasterCount = appState.masters.length;
      
      const lowStockMasters = appState.masters.filter(m => getMasterStockStatus(m.id).isLow);

      const activeInUseItems = appState.inUse.filter(i => i.status === 'ACTIVE');
      const nearEdInUse = activeInUseItems.filter(i => {
        const effEd = i.openedEd || i.ed;
        const d = getDaysUntilED(effEd);
        return d >= 0 && d <= 30;
      });
      const expiredInUse = activeInUseItems.filter(i => {
        const effEd = i.openedEd || i.ed;
        return getDaysUntilED(effEd) < 0;
      });

      const pendingOrders = (appState.orders || []).filter(o => o.status !== 'DITERIMA');

      return {
        activeMasterCount,
        totalSealedBottles,
        lowStockMasters,
        nearEdLots,
        expiredLots,
        activeInUseItems,
        activeInUseCount: activeInUseItems.length,
        nearEdInUse,
        expiredInUse,
        validLots,
        pendingOrders
      };
    }

    // =========================================================================
    // 3. UI HELPERS (BADGES, TOASTS, MODALS, NAVIGATION)
    // =========================================================================
    function renderCategoryBadge(category) {
      if (!category) return '';
      if (category === 'Prekursor') {

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const id = 'toast-' + Date.now();
      const styles = {
        success: 'bg-emerald-900 text-white border-emerald-700',
        warning: 'bg-amber-900 text-white border-amber-700',
        error:   'bg-rose-900 text-white border-rose-700',
        info:    'bg-navy-900 text-white border-slate-700'
      };
      const icons = {
        success: 'check-circle-2',
        warning: 'alert-triangle',
        error:   'x-octagon',
        info:    'info'
      };

      const toast = document.createElement('div');
      toast.id = id;
      toast.className = `pointer-events-auto flex items-start gap-3 p-3.5 rounded-xl border shadow-xl text-sm transition-all duration-300 translate-y-2 opacity-0 ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0 mt-0.5 text-teal-300"></i>
        <div class="flex-1 leading-snug">${message}</div>
        <button onclick="document.getElementById('${id}')?.remove()" class="text-white/70 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      `;
      container.appendChild(toast);
      lucide.createIcons();

      requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 4200);
    }

      if (activeBtn) {
        activeBtn.classList.remove('text-slate-300', 'hover:bg-slate-800/80', 'hover:text-white');

        'audit':     { cat: 'Kepatuhan', title: 'Audit Trail & Log', showSub: false }

    function renderSearchBar(varName, value, placeholder, focusKey) {
      return `

          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="text" data-focus-key="${focusKey}" autocomplete="off" value="${esc(value)}"
            oninput="liveSearch(${varName}, this.value)"
            placeholder="${placeholder}"
            class="w-full pl-11 pr-10 py-2.5 text-sm rounded-xl border border-slate-300 bg-white focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/15" />
          ${value ? `<button type="button" onclick="clearSearch(${varName})" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-rose-600" title="Hapus pencarian"><i data-lucide="x" class="w-4 h-4"></i></button>` : ''}
        </div>`;
    }

    function filterAndSortLots(filterObj) {
      const filtered = appState.lots.filter(lot => {
        if (lot.quarantined || Number(lot.qty) <= 0) return false;
        const master = getMasterById(lot.masterId);
        if (!master) return false;

        const edStatus = getEDStatus(lot.ed);
        const stockStat = getMasterStockStatus(master.id);

        if (filterObj.search && !matchesQuery(filterObj.search, master.name, master.catalogNo, lot.batchNo, master.manufacturer, master.cabinet)) return false;
        if (filterObj.edStatus !== 'ALL' && edStatus.code !== filterObj.edStatus) return false;
        if (filterObj.stockStatus === 'LOW' && !stockStat.isLow) return false;
        if (filterObj.stockStatus === 'SAFE' && stockStat.isLow) return false;
        if (filterObj.cabinet !== 'ALL' && master.cabinet !== filterObj.cabinet) return false;
        if (filterObj.category !== 'ALL') {
          if (filterObj.category === 'ALL_B3') {
            if (!master.category.startsWith('B3')) return false;
          } else if (master.category !== filterObj.category) {
            return false;
          }
        }
        return true;
      });

      filtered.sort((a, b) => {
        const mA = getMasterById(a.masterId);
        const mB = getMasterById(b.masterId);
        if (filterObj.sortBy === 'ALPHA_ASC') return (mA?.name || '').localeCompare(mB?.name || '');
        if (filterObj.sortBy === 'ALPHA_DESC') return (mB?.name || '').localeCompare(mA?.name || '');
        if (filterObj.sortBy === 'MODIFIED_DESC') return (b.dateModified || '').localeCompare(a.dateModified || '');
        if (filterObj.sortBy === 'MODIFIED_ASC') return (a.dateModified || '').localeCompare(b.dateModified || '');
        return a.ed.localeCompare(b.ed);
      });
      return filtered;
    }

    function submitStockAdjustment(e, lotId) {
      e.preventDefault();
      const lot = appState.lots.find(l => l.id === lotId);
      const master = getMasterById(lot.masterId);
      const analyst = document.getElementById('adj-analyst').value.trim();
      const type = document.getElementById('adj-type').value;
      const val = parseInt(document.getElementById('adj-qty').value, 10);
      const reason = document.getElementById('adj-reason').value.trim();

      if (!analyst || !reason) {
        showToast('Nama analis dan alasan wajib diisi.', 'error');
        return;
      }

      const oldQty = lot.qty;
      let newQty = oldQty;

      if (type === 'SUBTRACT') {
        if (val <= 0 || val > oldQty) {
          showToast(`Pengurangan harus antara 1 sampai ${oldQty} botol.`, 'error');
          return;
        }
        newQty = oldQty - val;
      } else if (type === 'ADD') {
        if (val <= 0) {
          showToast('Penambahan minimal 1 botol.', 'error');
          return;
        }
        newQty = oldQty + val;
      } else if (type === 'SET') {
        if (val < 0) {
          showToast('Quantity fisik tidak boleh negatif.', 'error');
          return;
        }
        newQty = val;
      }

      lot.qty = newQty;
      lot.dateModified = getCurrentTimestampStr(0);
      saveState();
      addAuditLog(
        'STOCK_ADJUSTMENT',
        master.name,
        lot.batchNo,
        `${oldQty} → ${newQty} Botol (${newQty - oldQty >= 0 ? '+' : ''}${newQty - oldQty})`,
        reason,
        analyst
      );

      closeModal();
      renderCurrentRoute();
      showToast(`Penyesuaian stok <strong>${esc(master.name)}</strong> disimpan.`, 'success');
    }

    function updateNewReagentCabinetOptions() {
      const cabSelect = document.getElementById('new-cabinet');
      if (!cabSelect) return;
      const allowed = getAllowedStockCabinets(newReagentFormState.physicalForm);

    }

    function checkCatalogReferencePreview(catVal) {
      const hint = document.getElementById('catalog-ref-hint');
      if (!hint) return;
      const q = catVal.trim().toLowerCase();
      if (!q) {
        hint.innerHTML = 'Acuan kemasan standar untuk Cat no. ini';
        hint.className = 'text-[11px] text-slate-400 mt-1';
        return;
      }
      const existing = appState.masters.find(m => m.catalogNo.toLowerCase() === q);
      if (existing) {
        hint.innerHTML = `<span class="text-amber-700 font-semibold">Cat no. sudah terdaftar (${esc(existing.name)} — ${esc(existing.volumePerBottle)}).</span>`;
      } else {
        hint.innerHTML = `<span class="text-teal-700 font-medium">Cat no. baru siap didaftarkan.</span>`;
      }
    }

    function submitExistingStockIn(e) {
      e.preventDefault();
      const masterId = document.getElementById('in-existing-master').value;
      const batchNo = document.getElementById('in-existing-batch').value.trim().toUpperCase();
      const ed = document.getElementById('in-existing-ed').value;
      const qty = parseInt(document.getElementById('in-existing-qty').value, 10);
      const analyst = document.getElementById('in-existing-analyst').value.trim();
      const rawNotes = document.getElementById('in-existing-notes').value.trim();
      const notes = rawNotes || 'Penerimaan stok masuk';
      const receivedDate = document.getElementById('in-existing-received').value || getRelativeDateStr(0);

      const master = getMasterById(masterId);
      if (!master || !batchNo || !ed || qty <= 0 || !analyst) return;

      const nowTs = getCurrentTimestampStr(0);
      const detailInfo = `Cat no.: ${master.catalogNo} | Manufaktur: ${master.manufacturer || '-'} | Kemasan: ${master.volumePerBottle} | Lemari: ${master.cabinet} | Bentuk: ${master.physicalForm} | Kategori: ${master.category} | Min. Stok: ${master.minStock} btl | ED Mfg: ${formatDateID(ed)} | Tgl Terima: ${formatDateID(receivedDate)}${rawNotes ? ' | Ket: ' + rawNotes : ''}`;
      const existingLot = appState.lots.find(l => l.masterId === masterId && l.batchNo.toUpperCase() === batchNo && l.ed === ed && !l.quarantined);
      if (existingLot) {
        const oldQty = existingLot.qty;
        existingLot.qty += qty;
        existingLot.dateModified = nowTs;
        existingLot.receivedDate = receivedDate;
        if (rawNotes) existingLot.notes = rawNotes;
        addAuditLog('STOK_MASUK', master.name, batchNo, `${oldQty} → ${existingLot.qty} Botol (+${qty} Btl)`, detailInfo, analyst);
      } else {
        appState.lots.push({
          id: 'LOT-' + Date.now().toString().slice(-6),
          masterId,
          batchNo,
          ed,
          qty,
          quarantined: false,
          dateModified: nowTs,
          receivedDate,
          notes: rawNotes
        });
        addAuditLog('STOK_MASUK', master.name, batchNo, `0 → ${qty} Botol (ED: ${formatDateID(ed)})`, detailInfo, analyst);
      }

      saveState();
      showToast(`<strong>${qty} botol</strong> ${esc(master.name)} (Lot ${esc(batchNo)}) ditambahkan.`, 'success');
      navigateTo('stock-db');
    }

    function submitNewReagentStockIn(e) {
      e.preventDefault();
      const name = document.getElementById('new-name').value.trim();
      const catalogNo = document.getElementById('new-catalog').value.trim();
      const volumePerBottle = document.getElementById('new-volume').value.trim();
      const cabinet = document.getElementById('new-cabinet').value;
      const physicalForm = document.getElementById('new-form').value;
      const category = document.getElementById('new-category').value;
      const minStock = parseInt(document.getElementById('new-minstock').value, 10);
      const batchNo = document.getElementById('new-batch').value.trim().toUpperCase();
      const ed = document.getElementById('new-ed').value;
      const qty = parseInt(document.getElementById('new-qty').value, 10);
      const analyst = document.getElementById('new-analyst').value.trim();
      const manufacturer = document.getElementById('new-manufacturer').value.trim() || '-';
      const receivedDate = document.getElementById('new-received').value || getRelativeDateStr(0);
      const lotNotes = document.getElementById('new-notes').value.trim();

      const duplicateCat = appState.masters.find(m => m.catalogNo.toLowerCase() === catalogNo.toLowerCase());
      if (duplicateCat) {
        showToast(`Cat no. <strong>${esc(catalogNo)}</strong> sudah terdaftar (${esc(duplicateCat.name)}).`, 'error');
        return;
      }

      const newMasterId = 'M-' + Date.now().toString().slice(-5);
      appState.masters.push({
        id: newMasterId,
        name,
        catalogNo,
        volumePerBottle,
        cabinet,
        physicalForm,
        category,
        minStock,
        manufacturer
      });

      appState.lots.push({
        id: 'LOT-' + Date.now().toString().slice(-6),
        masterId: newMasterId,
        batchNo,
        ed,
        qty,
        quarantined: false,
        dateModified: getCurrentTimestampStr(0),
        receivedDate,
        notes: lotNotes
      });

      saveState();
      const newDetailInfo = `Cat no.: ${catalogNo} | Manufaktur: ${manufacturer} | Kemasan: ${volumePerBottle} | Lemari: ${cabinet} | Bentuk: ${physicalForm} | Kategori: ${category} | Min. Stok: ${minStock} btl | ED Mfg: ${formatDateID(ed)} | Tgl Terima: ${formatDateID(receivedDate)}${lotNotes ? ' | Ket: ' + lotNotes : ''}`;
      addAuditLog(
        'REGISTRASI_BARU',
        name,
        batchNo,
        `Baru → ${qty} Botol (${cabinet}, Min: ${minStock})`,
        newDetailInfo,
        analyst
      );

      showToast(`Reagen baru <strong>${esc(name)}</strong> didaftarkan (${qty} botol).`, 'success');
      navigateTo('stock-db');
    }

    function renderStockOut(container) {
      const allAvailableLots = appState.lots
        .filter(l => !l.quarantined && Number(l.qty) > 0)
        .sort((a, b) => a.ed.localeCompare(b.ed));

      const fefoFirstByMaster = {};
      allAvailableLots.forEach(l => {
        if (getDaysUntilED(l.ed) >= 0 && !fefoFirstByMaster[l.masterId]) {
          fefoFirstByMaster[l.masterId] = l.id;
        }
      });

      const displayedLots = filterAndSortLots(stockOutFilters);
      const hasSoFilter = stockOutFilters.search || stockOutFilters.edStatus !== 'ALL' || stockOutFilters.stockStatus !== 'ALL' || stockOutFilters.cabinet !== 'ALL' || stockOutFilters.category !== 'ALL' || stockOutFilters.sortBy !== 'FEFO';
      const sel = FILTER_SELECT_CLS;

      Object.keys(cutStockSelection).forEach(lotId => {
        const lot = allAvailableLots.find(l => l.id === lotId);
        if (!lot || getDaysUntilED(lot.ed) < 0) delete cutStockSelection[lotId];
      });

      const selectedIds = Object.keys(cutStockSelection);
      const totalBottlesSelected = selectedIds.reduce((sum, id) => sum + (cutStockSelection[id].qty || 0), 0);

      container.innerHTML = `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-2xs space-y-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">

                <div class="w-10 h-10 rounded-xl bg-teal-50 text-teal-700 flex items-center justify-center shrink-0">
                  <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
                <div>
                  <h2 class="text-sm font-bold text-slate-900">Potong Stock (Urutan FEFO)</h2>
                  <p class="text-xs text-slate-500">Prioritaskan batch berlabel <span class="font-semibold text-teal-700">FEFO #1</span> &bull; Menampilkan <strong>${displayedLots.length}</strong> lot</p>
                </div>
              </div>

              <div class="flex flex-wrap items-center gap-3 shrink-0 self-end md:self-center">
                ${renderExportButtons('stock-out')}
                <div class="text-right">
                  <div class="text-[11px] text-slate-500">Dipilih</div>

    function toggleCutLot(lotId, isChecked) {
      if (isChecked) {
        const lot = appState.lots.find(l => l.id === lotId);
        const master = lot ? getMasterById(lot.masterId) : null;
        cutStockSelection[lotId] = {
          qty: 1,
          inUseCabinet: getDefaultInUseCabinet(master?.physicalForm || 'Cair')
        };
      } else {
        delete cutStockSelection[lotId];
      }
      renderCurrentRoute();
    }

    function updateCutQty(lotId, newQty) {
      const lot = appState.lots.find(l => l.id === lotId);
      if (!lot || !cutStockSelection[lotId]) return;
      if (isNaN(newQty) || newQty < 1) {
        cutStockSelection[lotId].qty = 1;
      } else if (newQty > lot.qty) {
        cutStockSelection[lotId].qty = lot.qty;
        showToast(`Maksimal ${lot.qty} botol untuk batch ${esc(lot.batchNo)}.`, 'warning');
      } else {
        cutStockSelection[lotId].qty = newQty;
      }
      renderCurrentRoute();
    }

    function submitCutStock(e) {
      e.preventDefault();
      const analyst = rememberAnalyst(document.getElementById('cut-analyst').value.trim());
      const customOpenedEd = document.getElementById('cut-opened-ed').value;
      const notes = document.getElementById('cut-notes').value.trim() || 'Dipotong untuk pengujian laboratorium';
      const todayStr = getRelativeDateStr(0);
      const nowTs = getCurrentTimestampStr(0);

      const selectedIds = Object.keys(cutStockSelection);
      let totalProcessed = 0;

      selectedIds.forEach(lotId => {
        const lot = appState.lots.find(l => l.id === lotId);
        const master = getMasterById(lot.masterId);
        const takeQty = cutStockSelection[lotId].qty;
        const chosenInUseCab = document.getElementById(`cut-inuse-cab-${lotId}`)?.value || getDefaultInUseCabinet(master.physicalForm);
        if (!lot || !master || takeQty <= 0 || takeQty > lot.qty) return;

        const oldQty = lot.qty;
        lot.qty -= takeQty;
        lot.dateModified = nowTs;
        totalProcessed += takeQty;

        for (let i = 0; i < takeQty; i++) {
          appState.inUse.unshift({
            id: 'IU-' + Date.now().toString().slice(-5) + '-' + Math.floor(Math.random() * 900 + 100),
            masterId: master.id,
            batchNo: lot.batchNo,
            ed: lot.ed,
            openedDate: todayStr,
            openedEd: customOpenedEd || lot.ed,
            inUseCabinet: chosenInUseCab,
            openedBy: analyst,
            status: 'ACTIVE',
            closedDate: null,
            notes
          });
        }

        addAuditLog(
          'POTONG_STOCK',
          master.name,
          lot.batchNo,
          `${oldQty} → ${lot.qty} Botol (${takeQty} ke ${chosenInUseCab} In-Use)`,
          notes,
          analyst
        );
      });

      cutStockSelection = {};
      saveState();
      closeModal();
      showToast(`<strong>${totalProcessed} botol</strong> dipindahkan ke <strong>Reagent In-Use</strong>.`, 'success');
      navigateTo('in-use');
    }

                    const statusBadge = ord.status === 'BELUM_DIPESAN'

                    return `
                      <tr class="align-top hover:bg-slate-50 ${isChecked ? 'bg-teal-50/40' : ''}">
                        <td class="py-3.5 px-3 text-center">
                          <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleOrderSelection('${ord.id}', this.checked)"

                        <td class="py-3.5 px-3 text-slate-700 font-medium">${esc(ord.manufacturer || '-')}</td>
                        <td class="py-3.5 px-3 text-slate-700">${esc(ord.unit)}</td>
                        <td class="py-3.5 px-3 text-center font-mono font-bold text-slate-900 text-sm">${ord.qty}</td>
                        <td class="py-3.5 px-3">
                          ${statusBadge}
                          ${ord.pbjNo ? `<div class="text-[10px] font-mono text-slate-600 mt-1">PBJ: <strong>${esc(ord.pbjNo)}</strong></div>` : ''}
                        </td>
                        <td class="py-3.5 px-3 text-slate-600">
                          <div class="font-medium text-slate-800">${esc(ord.requestedBy || '-')}</div>
                          <div class="text-[10px] text-slate-400">Req: ${formatDateID(ord.requestDate)}</div>
                        </td>
                        <td class="py-3.5 px-3 text-right whitespace-nowrap">
                          <div class="flex flex-wrap items-center justify-end gap-1.5">
                            ${ord.status === 'BELUM_DIPESAN' ? `
                              <button onclick="markOrderStatus('${ord.id}', 'SUDAH_DIPESAN')" class="px-2.5 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-700 text-white text-[11px] font-semibold">
                                Tandai Dipesan
                              </button>
                            ` : ord.status === 'SUDAH_DIPESAN' ? `
                              <button onclick="markOrderStatus('${ord.id}', 'DITERIMA')" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-semibold">

                              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

      else delete orderSelection[orderId];

    function submitReorderModal(e, masterId) {
      e.preventDefault();
      const m = getMasterById(masterId);
      if (!m) return;
      const analyst = rememberAnalyst(document.getElementById('reorder-analyst').value.trim());
      const unit = document.getElementById('reorder-unit').value.trim();
      const qty = parseInt(document.getElementById('reorder-qty').value, 10);
      const notes = document.getElementById('reorder-notes').value.trim();

      const newOrd = {
        id: 'ORD-' + Date.now().toString().slice(-6),
        masterId: m.id,
        reagentName: m.name,
        catalogNo: m.catalogNo,
        manufacturer: m.manufacturer || '-',
        unit,
        qty,
        status: 'BELUM_DIPESAN',
        pbjNo: '',
        requestedBy: analyst,
        requestDate: getRelativeDateStr(0),
        orderedDate: '',
        notes
      };

      appState.orders.unshift(newOrd);
      orderSelection[newOrd.id] = true;
      saveState();
      addAuditLog('REORDER_REQUEST', m.name, m.catalogNo, `Masuk List Pemesanan (${qty} ${unit})`, notes || 'Permintaan re-order', analyst);
      closeModal();
      showToast(`<strong>${esc(m.name)}</strong> (${qty} btl) ditambahkan ke List Pemesanan.`, 'success');
      navigateTo('orders');
    }

    function autofillManualOrderFromMaster(masterId) {
      const m = getMasterById(masterId);
      if (!m) return;
      document.getElementById('mord-name').value = m.name;
      document.getElementById('mord-cat').value = m.catalogNo;
      document.getElementById('mord-mfg').value = m.manufacturer || '';
      document.getElementById('mord-unit').value = `Botol (${m.volumePerBottle})`;
    }

    function submitAddManualOrder(e) {
      e.preventDefault();
      const name = document.getElementById('mord-name').value.trim();
      const cat = document.getElementById('mord-cat').value.trim() || '-';
      const mfg = document.getElementById('mord-mfg').value.trim();
      const unit = document.getElementById('mord-unit').value.trim();
      const qty = parseInt(document.getElementById('mord-qty').value, 10);
      const analyst = rememberAnalyst(document.getElementById('mord-analyst').value.trim());
      const notes = document.getElementById('mord-notes').value.trim();
      const matchedMaster = appState.masters.find(m => m.catalogNo.toLowerCase() === cat.toLowerCase());

      const newOrd = {
        id: 'ORD-' + Date.now().toString().slice(-6),
        masterId: matchedMaster ? matchedMaster.id : null,
        reagentName: name,
        catalogNo: cat,
        manufacturer: mfg,
        unit,
        qty,
        status: 'BELUM_DIPESAN',
        pbjNo: '',
        requestedBy: analyst,
        requestDate: getRelativeDateStr(0),
        orderedDate: '',
        notes
      };
      appState.orders.unshift(newOrd);
      orderSelection[newOrd.id] = true;
      saveState();
      addAuditLog('REORDER_REQUEST', name, cat, `Masuk List Pemesanan (${qty} ${unit})`, notes || 'Tambah manual', analyst);
      closeModal();
      renderCurrentRoute();
      showToast('Item berhasil ditambahkan ke List Pemesanan.', 'success');
    }

    function markOrderStatus(orderId, newStatus) {
      const ord = (appState.orders || []).find(o => o.id === orderId);
      if (!ord) return;
      ord.status = newStatus;
      if (newStatus === 'SUDAH_DIPESAN') ord.orderedDate = getRelativeDateStr(0);
      saveState();
      renderCurrentRoute();
      showToast(`Status <strong>${esc(ord.reagentName)}</strong> diperbarui.`, 'success');
    }

    function deleteOrderItem(orderId) {
      appState.orders = (appState.orders || []).filter(o => o.id !== orderId);
      delete orderSelection[orderId];
      saveState();
      renderCurrentRoute();
      showToast('Item dihapus dari List Pemesanan.', 'info');
    }

    function getFilteredInUse() {
      return appState.inUse.filter(item => {
        if (inUseFilters.tab === 'ACTIVE' && item.status !== 'ACTIVE') return false;
        if (inUseFilters.tab === 'ARCHIVE' && item.status === 'ACTIVE') return false;

        const master = getMasterById(item.masterId);
        if (!master) return false;
        const cab = item.inUseCabinet || getDefaultInUseCabinet(master.physicalForm);

        if (inUseFilters.search && !matchesQuery(inUseFilters.search, master.name, master.catalogNo, item.batchNo, master.manufacturer, item.openedBy, cab)) return false;
        if (inUseFilters.cabinet !== 'ALL' && cab !== inUseFilters.cabinet) return false;
        if (inUseFilters.physicalForm !== 'ALL' && master.physicalForm !== inUseFilters.physicalForm) return false;
        if (inUseFilters.category !== 'ALL') {
          if (inUseFilters.category === 'ALL_B3') {
            if (!master.category.startsWith('B3')) return false;
          } else if (master.category !== inUseFilters.category) {
            return false;
          }
        }
        return true;
      });
    }

    function validateEdLab(item, v) {
      const cur = item.openedEd || item.ed;
      if (!v) return { ok: false, msg: 'Pilih tanggal ED Lab baru.', tone: 'slate' };
      if (v > item.ed) return { ok: false, msg: `Melebihi ED Manufacturer (${formatDateID(item.ed)}).`, tone: 'rose' };
      if (item.openedDate && v < item.openedDate) return { ok: false, msg: `Tidak boleh sebelum tanggal dibuka (${formatDateID(item.openedDate)}).`, tone: 'rose' };
      if (v === cur) return { ok: false, msg: 'Belum ada perubahan dari ED Lab saat ini.', tone: 'slate' };
      return { ok: true };
    }

    function updateEdLabPreview(inUseId) {
      const item = appState.inUse.find(i => i.id === inUseId);
      const input = document.getElementById('edlab-input');
      const prev = document.getElementById('edlab-preview');
      const btn = document.getElementById('edlab-submit');
      if (!item || !input || !prev) return;
      const v = input.value;
      const res = validateEdLab(item, v);
      if (!res.ok) {
        const cls = res.tone === 'rose' ? 'text-rose-700' : 'text-slate-500';
        prev.innerHTML = `<span class="${cls}">${res.msg}</span>`;
      } else {
        const cur = item.openedEd || item.ed;
        const st = getEDStatus(v);
        const diff = getDaysUntilED(v) - getDaysUntilED(cur);
        prev.innerHTML = `ED Lab baru: <strong>${formatDateID(v)}</strong>
          <span class="ml-1 inline-flex px-1.5 py-0.5 rounded text-[10px] font-semibold border ${st.badgeClass}">${st.label}</span>
          <span class="text-slate-500 ml-1">(${diff > 0 ? '+' : '-'}${Math.abs(diff)} hr)</span>`;
      }
      if (btn) {
        btn.disabled = !res.ok;
        btn.classList.toggle('opacity-40', !res.ok);
        btn.classList.toggle('cursor-not-allowed', !res.ok);
      }
    }

    function esc(v) {
      return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function addDaysStr(dateStr, n) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + n);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function guessManufacturer(catalogNo) {
      return /^1\.\d{5}\.\d{4}$/.test(catalogNo || '') ? 'Merck KGaA' : '-';
    }

    function normalizeState(st) {
      st.analysts = Array.isArray(st.analysts) && st.analysts.length ? st.analysts : [...DEFAULT_ANALYSTS];
      if (!st.lastAnalyst) st.lastAnalyst = st.analysts[0];
      st.masters = st.masters || [];
      st.lots = st.lots || [];
      st.inUse = st.inUse || [];
      st.orders = st.orders || [];
      st.auditLogs = st.auditLogs || [];
      st.masters.forEach(m => { if (!m.manufacturer) m.manufacturer = guessManufacturer(m.catalogNo); });
      st.lots.forEach(l => {
        if (!l.receivedDate) {
          const baseDate = (l.dateModified || '').split(' ')[0] || getRelativeDateStr(0);
          l.receivedDate = addDaysStr(baseDate, -14);
        }
        if (l.notes === undefined) l.notes = 'Segel utuh, sesuai CoA';
      });
      st.inUse.forEach(i => {
        if (!i.receivedDate) {
          const lot = st.lots.find(l => l.masterId === i.masterId && l.batchNo === i.batchNo);
          i.receivedDate = lot ? lot.receivedDate : addDaysStr(i.openedDate || getRelativeDateStr(0), -14);
        }
      });
      return st;
    }

    function liveSearch(filterObj, value) {

    function matchesQuery(query, ...fields) {
      const tokens = String(query || '').toLowerCase().split(/\s+/).filter(Boolean);
      if (tokens.length === 0) return true;
      const hay = fields.map(f => String(f ?? '')).join(' ').toLowerCase();
      return tokens.every(t => hay.includes(t));
    }

    function copyText(text, okMsg = 'Link berhasil disalin.') {
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast(okMsg, 'success'); }
        catch (e) { showToast('Gagal menyalin otomatis.', 'warning'); }
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => showToast(okMsg, 'success')).catch(fallback);
      } else {
        fallback();
      }
    }
    function copyLinkFrom(btn) { copyText(btn.dataset.link); }

    const ROUTE_SLUGS = { 'dashboard': 'dashboard', 'stock-db': 'stock-list', 'stock-in': 'stock-in', 'stock-out': 'stock-out', 'orders': 'orders', 'in-use': 'in-use', 'audit': 'audit' };
    const SLUG_ROUTES = { 'dashboard': 'dashboard', 'stock-list': 'stock-db', 'stock-db': 'stock-db', 'stock-in': 'stock-in', 'stock-out': 'stock-out', 'orders': 'orders', 'in-use': 'in-use', 'inuse': 'in-use', 'audit': 'audit' };

    function syncHash(route) {
      try { history.replaceState(null, '', location.href.split('#')[0] + '#/' + (ROUTE_SLUGS[route] || route)); } catch (e) {}
    }

    function buildDeepLink(slug, catNo, lotNo) {
      let url = location.href.split('#')[0] + '#/' + slug;
      if (catNo && lotNo) url += '/' + encodeURIComponent(catNo) + '/' + encodeURIComponent(lotNo);
      return url;
    }

    function handleDeepLink() {
      const raw = (location.hash || '').replace(/^#\/?/, '');
      if (!raw) return false;
      const parts = raw.split('/').map(p => { try { return decodeURIComponent(p); } catch (e) { return p; } });
      const route = SLUG_ROUTES[(parts[0] || '').toLowerCase()];
      if (!route) return false;
      const cat = (parts[1] || '').trim();
      const lot = (parts[2] || '').trim();
      const eq = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();

      let openKind = null, openId = null, notFound = false;

      if (route === 'stock-db') {
        dbFilters = { search: '', edStatus: 'ALL', stockStatus: 'ALL', cabinet: 'ALL', category: 'ALL', sortBy: 'FEFO' };
        if (cat && lot) {
          const cands = appState.lots.filter(l => { const m = getMasterById(l.masterId); return m && eq(m.catalogNo, cat) && eq(l.batchNo, lot); });
          const found = cands.find(l => !l.quarantined && Number(l.qty) > 0) || cands[0];
          if (found) { openKind = 'stock'; openId = found.id; } else notFound = true;
        }
      } else if (route === 'in-use') {
        inUseFilters = { tab: 'ACTIVE', search: '', cabinet: 'ALL', physicalForm: 'ALL', category: 'ALL' };
        if (cat && lot) {
          const cands = appState.inUse.filter(i => { const m = getMasterById(i.masterId); return m && eq(m.catalogNo, cat) && eq(i.batchNo, lot); });
          const found = cands.find(i => i.status === 'ACTIVE') || cands[0];
          if (found) {
            openKind = 'inuse'; openId = found.id;
            if (found.status !== 'ACTIVE') inUseFilters.tab = 'ARCHIVE';
          } else notFound = true;
        }
      }

      navigateTo(route);

      if (openKind) openReagentDetail(openKind, openId);
      else if (notFound) {
        const where = route === 'stock-db' ? 'Reagent Stock List' : 'Reagent In-Use';
        showToast(`Reagen Cat no. <strong>${esc(cat)}</strong> &bull; Lot <strong>${esc(lot)}</strong> tidak ditemukan di ${where}.`, 'warning');
      }
      return true;
    }

        sub: `Total ${logs.length} catatan`,
        filename: `Audit_Trail_E-Reagent_${getRelativeDateStr(0)}`,
        headers: ['Tanggal & Jam', 'Analis', 'Aktivitas', 'Nama Reagen', 'Batch / Lot', 'Perubahan', 'Keterangan'],
        rows: logs.map(l => [l.timestamp, l.user, (ACTION_BADGES[l.actionType] || {}).label || l.actionType, l.reagentName, l.batchNo, l.changeSummary, l.notes])
      };
    }

    function exportDatasetCSV(scope) {
      try {
        const ds = getExportDataset(scope);
        const escapeCell = (v) => `"${String(v ?? '').replace(/\r?\n/g, ' ').replace(/"/g, '""')}"`;
        const csvBody = '\uFEFF' + [
          ds.headers.map(escapeCell).join(','),
          ...ds.rows.map(r => r.map(escapeCell).join(','))
        ].join('\r\n');

        const blob = new Blob([csvBody], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `${ds.filename}.csv`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 250);

        showToast(`Berhasil mengunduh <strong>${ds.filename}.csv</strong> (${ds.rows.length} baris).`, 'success');
      } catch (err) {
        console.error('CSV export failed:', err);
        showToast('Gagal membuat file CSV. Gunakan tombol Cetak / PDF sebagai alternatif.', 'error');
      }
    }

    function getFilteredAuditLogs() {
      return appState.auditLogs.filter(log => {
        const logDate = log.timestamp.split(' ')[0];
        if (auditFilters.dateFrom && logDate < auditFilters.dateFrom) return false;
        if (auditFilters.dateTo && logDate > auditFilters.dateTo) return false;
        if (auditFilters.actionType !== 'ALL' && log.actionType !== auditFilters.actionType) return false;

        if (auditFilters.search && !matchesQuery(auditFilters.search, log.reagentName, log.batchNo, log.notes, log.user)) return false;
        return true;
      });
    }

                class="w-full rounded-xl border border-slate-200 pl-3 pr-8 py-1.5 text-xs focus:outline-none focus:border-teal-600" />
              ${(auditFilters.dateFrom || auditFilters.dateTo || auditFilters.actionType!=='ALL' || auditFilters.user!=='ALL' || auditFilters.search) ? `
                <button onclick="auditFilters={dateFrom:'',dateTo:'',actionType:'ALL',search:'',user:'ALL'}; renderCurrentRoute();" class="absolute right-2 top-1/2 -translate-y-1/2 text-rose-500 hover:text-rose-700" title="Reset Filter">
                  <i data-lucide="x-circle" class="w-3.5 h-3.5"></i>
                </button>
              ` : ''}
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-2xs overflow-hidden">
          <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 text-xs text-slate-500 flex justify-between items-center">
            <span>Menampilkan <strong>${logs.length}</strong> catatan audit</span>
            <span class="font-mono text-[11px]">Kronologis & Permanen</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50/70 border-b border-slate-200 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                  <th class="py-3 px-3.5">Tanggal & Jam</th>
                  <th class="py-3 px-3">Nama Analis</th>
                  <th class="py-3 px-3">Aktivitas</th>
                  <th class="py-3 px-3">Reagen & Lot</th>
                  <th class="py-3 px-3">Perubahan</th>
                  <th class="py-3 px-3.5">Keterangan</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 text-xs">
                ${logs.length === 0 ? `
                  <tr><td colspan="6" class="py-12 text-center text-slate-500">Tidak ada catatan audit pada filter yang dipilih.</td></tr>
                ` : logs.map(log => {
                  const badge = ACTION_BADGES[log.actionType] || { label: log.actionType, cls: 'bg-slate-100 text-slate-700 border-slate-200' };
                  return `
                    <tr class="hover:bg-slate-50 transition-colors">
                      <td class="py-3 px-3.5 font-mono text-[11px] text-slate-700 whitespace-nowrap">${esc(log.timestamp)}</td>
                      <td class="py-3 px-3 font-medium text-slate-800">${esc(log.user)}</td>
                      <td class="py-3 px-3"><span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold border ${badge.cls}">${badge.label}</span></td>
                      <td class="py-3 px-3">
                        <div class="font-semibold text-slate-900">${esc(log.reagentName)}</div>
                        <div class="text-[11px] font-mono text-slate-500">Lot: ${esc(log.batchNo)}</div>
                      </td>
                      <td class="py-3 px-3 font-mono font-semibold text-slate-800">${esc(log.changeSummary)}</td>
                      <td class="py-3 px-3.5 text-slate-600 max-w-xs">${esc(log.notes)}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 10. RESET DEMO DATA MODAL
    // =========================================================================
    function openResetModal() {
      openModal(`
        <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-amber-50">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-amber-500 text-white flex items-center justify-center"><i data-lucide="rotate-ccw" class="w-5 h-5"></i></div>
            <div>
              <h3 class="text-sm font-bold text-slate-900">Reset Data Demo</h3>
              <p class="text-xs text-slate-600">Kembalikan data ke kondisi awal</p>
            </div>
          </div>
          <button onclick="closeModal()" class="p-1 text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-5 space-y-4 text-xs sm:text-sm">
          <p class="text-slate-600">Seluruh data stok, pemesanan, PBJ, dan audit log akan dikosongkan ke kondisi awal bersih (kosongan untuk pengujian/PQ).</p>
          <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Batal</button>
            <button onclick="confirmResetDemoData()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-amber-600 hover:bg-amber-700 text-white shadow-xs">Reset Sekarang</button>
          </div>
        </div>
      `);
    }

    function confirmResetDemoData() {
      localStorage.removeItem(STORAGE_KEY);
      appState = createInitialSeedData();
      saveState(appState);
      cutStockSelection = {};
      orderSelection = {};
      dbFilters = { search: '', edStatus: 'ALL', stockStatus: 'ALL', cabinet: 'ALL', category: 'ALL', sortBy: 'FEFO' };
      stockInFilters = { search: '', edStatus: 'ALL', stockStatus: 'ALL', cabinet: 'ALL', category: 'ALL', sortBy: 'FEFO' };
      stockOutFilters = { search: '', edStatus: 'ALL', stockStatus: 'ALL', cabinet: 'ALL', category: 'ALL', sortBy: 'FEFO' };
      inUseFilters = { tab: 'ACTIVE', search: '', cabinet: 'ALL', physicalForm: 'ALL', category: 'ALL' };
      orderFilters = { status: 'ALL', search: '' };
      auditFilters = { dateFrom: '', dateTo: '', actionType: 'ALL', search: '', user: 'ALL' };
      refreshAnalystDatalist();
      closeModal();
      navigateTo('dashboard');
      showToast('Sistem berhasil dikosongkan ke kondisi awal bersih.', 'info');
    }

    // =========================================================================
    // 11. BOOTSTRAP ON LOAD
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      const todayFormatted = new Date().toLocaleDateString('id-ID', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
      document.getElementById('current-date-display').textContent = todayFormatted;

      refreshAnalystDatalist();
      if (!handleDeepLink()) navigateTo('dashboard');
      window.addEventListener('hashchange', handleDeepLink);
    });
  </script>
</body>
</html>
